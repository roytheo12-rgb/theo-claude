<title>Sillage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
/* Sillage — cabinet de parfumeur : noir chaud, or champagne, oxblood, typographie SF.
   Aucun vert, aucun pastel. Traits fins, angles francs, mouvement lent. Thème sombre unique. */
:root {
  color-scheme: dark;
  --bg: #08080a; --surface: #131215; --surface2: #1a181c; --ink: #f4f0ea; --muted: #94908a;
  --line: rgba(255, 255, 255, .10); --line2: rgba(255, 255, 255, .22);
  --accent: #e9e1d4; --accent-soft: rgba(233, 225, 212, .07); --accent-deep: #f6f1e8; --wine: #b4394a;
  --oxblood: #6f1d29;
  --cta-bg: #efe8dc; --cta-fg: #0d0b0c; --glass: rgba(12, 11, 13, .84);
  --sf: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --f-display: var(--sf); --f-body: var(--sf); --f-mono: var(--sf);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sf); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(90% 46% at 50% -8%, rgba(122, 31, 43, .42), transparent 70%), radial-gradient(80% 40% at 100% 100%, rgba(44, 54, 76, .34), transparent 72%); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.mono { font: 500 11px var(--sf); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

/* ---------- Coque ---------- */
#app { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-bottom: 120px; }
.bar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px 8px; }
.mark { font: 600 14px var(--sf); letter-spacing: .38em; text-transform: uppercase; color: var(--accent-deep); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); }
.iconbtn svg { width: 19px; height: 19px; }
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100vw - 32px));
  display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 4px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--line); z-index: 20; }
.dock button { position: relative; z-index: 1; border: 0; background: none; padding: 11px 2px 10px; display: grid; justify-items: center; gap: 3px; font-size: 9px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); transition: color .3s; }
.dock button svg { width: 20px; height: 20px; }
.dock button.on { color: var(--accent-deep); }
.dock .ind { position: absolute; left: 0; bottom: 0; height: 2px; width: 20%; background: var(--wine); transition: transform .5s cubic-bezier(.2, .8, .2, 1); }

/* ---------- Composants ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.sec { margin-top: 34px; display: grid; gap: 14px; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec h2 { font: 300 26px/1.1 var(--sf); letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 3px; padding: 9px 14px; font-size: 13.5px; transition: border-color .25s, background .25s; text-align: left; }
.chip:hover { border-color: var(--line2); }
.chip.on { background: rgba(180, 57, 74, .16); border-color: var(--wine); color: var(--accent-deep); }
.cta { position: relative; overflow: hidden; border: 0; border-radius: 3px; background: var(--cta-bg); color: var(--cta-fg); padding: 16px 24px; font: 600 12.5px var(--sf); letter-spacing: .2em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.cta:active { transform: scale(.985); }
.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .38) 50%, transparent 65%); transform: translateX(-130%); animation: sheen 5s ease-in-out infinite; }
@keyframes sheen { 55%, 100% { transform: translateX(130%); } }
.cta.full { width: 100%; }
.cta[disabled] { opacity: .5; }
.ghost { border: 1px solid var(--line2); background: transparent; border-radius: 3px; padding: 10px 16px; font: 500 11.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.ghost.danger { color: #d8897a; border-color: rgba(216, 137, 122, .4); }
textarea, input[type=text] { width: 100%; font: 16px/1.45 var(--sf); color: var(--ink); background: #1e1c22; border: 1px solid var(--line2); border-radius: 4px; padding: 14px 16px; resize: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); transition: border-color .25s, box-shadow .25s; }
textarea::placeholder, input::placeholder { color: #b9b4ad; opacity: 1; }
textarea:focus, input[type=text]:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(180, 57, 74, .22); }
.fieldlab { display: flex; align-items: center; gap: 8px; font: 600 11px var(--sf); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-deep); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(214, 186, 140, .2); }
.dots i.f { background: var(--accent); }
.tag { font: 500 10.5px var(--sf); letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); }
.empty { padding: 26px 8px; text-align: center; color: var(--muted); }
.spark { display: none; }
.linkbtn { color: var(--accent-deep); font: 500 12px var(--sf); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid var(--line2); padding-bottom: 2px; }

/* ---------- Accueil ---------- */
.hero { position: relative; margin-top: 26px; }
.hero .blob { display: none; }
.hero h1 { font: 200 clamp(46px, 14vw, 68px)/1 var(--sf); letter-spacing: -.045em; margin: 6px 0 4px; }
.hero h1 em { font-style: normal; color: var(--accent-deep); font-weight: 300; }
.hero .q { font: 300 21px/1.3 var(--sf); color: var(--muted); letter-spacing: -.01em; margin-bottom: 20px; }
.say-wrap { display: grid; gap: 14px; }
.say-wrap textarea { min-height: 104px; padding: 16px; font-size: 17px; font-weight: 300; animation: nudge 3.2s ease-in-out infinite; }
.say-wrap textarea:focus { animation: none; }
@keyframes nudge { 0%, 100% { border-color: var(--line2); } 50% { border-color: rgba(180, 57, 74, .8); } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.photo-btn { display: inline-flex; align-items: center; gap: 8px; }
.photo-btn svg { width: 16px; height: 16px; }
.photo-btn img { width: 22px; height: 22px; border-radius: 2px; object-fit: cover; }
.today-card { display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; }
.strip { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 82px; text-align: center; scroll-snap-align: start; font-size: 11.5px; color: var(--muted); }
.mini .bwrap { height: 92px; }
.mini b { display: block; color: var(--ink); font-weight: 500; font-size: 12px; line-height: 1.2; margin-top: 6px; }
.vit { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 6px 20px 10px; scrollbar-width: none; }
.vit::-webkit-scrollbar { display: none; }
.vit button { flex: 0 0 148px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 4px; background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .3)); padding: 16px 10px 12px; text-align: center; position: relative; overflow: hidden; }
.vit .bwrap { height: 190px; }
.vit b { display: block; font: 500 13px/1.2 var(--sf); margin-top: 12px; }
.vit small { color: var(--muted); font-size: 11.5px; letter-spacing: .04em; }
.jr { display: grid; gap: 12px; }
.jr textarea { min-height: 70px; }

/* ---------- Flacons ---------- */
.bwrap { display: block; margin-inline: auto; position: relative; width: fit-content; max-width: 100%; }
.bwrap svg { display: block; height: 100%; width: auto; margin-inline: auto; overflow: visible; }
.bob { animation: bob 7s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.8deg); } 50% { transform: translateY(-6px) rotate(.8deg); } }
.wv.w1 { animation: wave 5s linear infinite; }
.wv.w2 { animation: wave 7.5s linear infinite reverse; }
@keyframes wave { from { transform: translateX(-120px); } to { transform: translateX(0); } }
.shine { animation: shine 8s ease-in-out infinite; }
@keyframes shine { 0%, 100% { transform: translateX(0); opacity: .42; } 50% { transform: translateX(34px); opacity: .1; } }
.lbub { animation: lrise 6s linear infinite; opacity: 0; transform-box: fill-box; }
@keyframes lrise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(var(--rise)); opacity: 0; } }
.mist { opacity: 0; transform-box: fill-box; transform-origin: center; animation: mist 3s ease-out infinite; }
@keyframes mist { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.9); } }
.aura { position: absolute; inset: 8% -20%; border-radius: 50%; filter: blur(34px); opacity: .6; animation: breathe 7s ease-in-out infinite; z-index: -1; }
@keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .4; } 50% { transform: scale(1.08); opacity: .7; } }
.bwrap.photo img { object-fit: contain; height: 100%; width: auto; max-width: 100%; display: block; margin-inline: auto; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .65)); -webkit-box-reflect: below 0 linear-gradient(transparent 78%, rgba(255, 255, 255, .13)); }
.bwrap .mp { position: absolute; left: 50%; width: 0; height: 0; }
.bwrap .mp i { position: absolute; border-radius: 50%; background: rgba(255, 244, 224, .9); opacity: 0; animation: mistp 3s ease-out infinite; }
@keyframes mistp { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2); } }

/* ---------- Étagère ---------- */
.ribbon { display: flex; height: 3px; gap: 2px; }
.ribbon i { display: block; height: 100%; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pcard { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 16px 12px 14px; text-align: left; overflow: hidden; background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .35)); isolation: isolate; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.pcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 34%, var(--tint), transparent 68%); opacity: .5; z-index: -1; }
.pcard .bwrap { height: 168px; margin-bottom: 12px; }
.pcard b { display: block; font: 500 15px/1.2 var(--sf); letter-spacing: -.01em; }
.pcard span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.pcard:active { transform: scale(.985); }
.add-tile { border: 1px dashed var(--line2); background: transparent; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 8px; min-height: 240px; border-radius: 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.add-tile b { font: 200 40px/1 var(--sf); color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; }
.stat { padding: 14px 12px 12px; min-width: 0; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font: 300 22px/1.15 var(--sf); letter-spacing: -.03em; overflow-wrap: anywhere; }
.stat span { font: 500 10px var(--sf); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }

/* ---------- Découvrir ---------- */
.snap { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 20px 16px; margin-inline: -20px; scrollbar-width: none; }
.snap::-webkit-scrollbar { display: none; }
.rec { position: relative; flex: 0 0 82%; max-width: 340px; scroll-snap-align: center; border-radius: 4px; padding: 20px 18px 18px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .4)); display: grid; gap: 12px; overflow: hidden; isolation: isolate; }
.rec::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 22%, var(--tint), transparent 62%); opacity: .5; z-index: -1; }
.rec .bwrap { height: 170px; }
.rec h3 { font: 400 22px/1.15 var(--sf); letter-spacing: -.02em; }
.rec .why { font-size: 14px; color: var(--muted); }
.rec .why:empty { display: none; }
.pct { position: absolute; top: 14px; right: 14px; font: 500 11px var(--sf); letter-spacing: .12em; color: var(--accent-deep); border: 1px solid var(--line2); padding: 4px 9px; border-radius: 2px; z-index: 2; }
.ask-card { display: grid; gap: 12px; }
.aires { display: grid; gap: 12px; }
.aires .rec { flex: none; max-width: none; grid-template-columns: 96px 1fr; align-items: center; }
.aires .rec .bwrap { height: 130px; }
.shim { background: linear-gradient(100deg, var(--surface2) 30%, #2a221c 50%, var(--surface2) 70%) 0 0 / 300% 100%; border-radius: 2px; height: 14px; animation: shim 1.6s linear infinite; }
@keyframes shim { to { background-position: -300% 0; } }
.buy { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Feuille ---------- */
#sheet { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; }
#sheet[hidden] { display: none; }
#sheet .veil { position: absolute; inset: 0; background: rgba(0, 0, 0, .68); animation: fade .35s both; }
#sheet .panel { position: relative; width: min(620px, 100%); margin-inline: auto; max-height: 90vh; overflow-y: auto; background: #100d0c; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 12px 20px calc(30px + env(safe-area-inset-bottom, 0px)); animation: up .5s cubic-bezier(.2, .9, .25, 1) both; display: grid; gap: 16px; }
#sheet .grab { width: 40px; height: 3px; border-radius: 2px; background: var(--line2); margin: 0 auto 6px; }
#sheet h2 { font: 300 30px/1.1 var(--sf); letter-spacing: -.03em; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.big-bottle { position: relative; height: 250px; isolation: isolate; }
.big-bottle .bwrap { height: 100%; }
.meter { display: grid; grid-template-columns: 100px 1fr; align-items: center; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.stars button { border: 0; background: none; font-size: 24px; padding: 0 2px; color: var(--accent); }
.pre { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); animation: rise .6s both; animation-delay: calc(var(--i, 0) * 80ms); }
.pre .bwrap { height: 66px; }
.pre b { font: 500 15px/1.2 var(--sf); }
.pre small { color: var(--muted); display: block; }
.wk { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); animation: rise .6s both; animation-delay: calc(var(--i) * 80ms); }
.wk .bwrap { height: 76px; }
.wk .d { font: 500 10.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); }
.wk b { font: 500 16px/1.2 var(--sf); }
.wk p { font-size: 13px; color: var(--muted); }
.pickrow { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: none; }
.pickrow::-webkit-scrollbar { display: none; }
.pk { flex: 0 0 78px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 8px 4px 6px; text-align: center; font-size: 11px; line-height: 1.2; color: var(--muted); }
.pk .bwrap { height: 80px; }
.pk.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.mixstage { position: relative; height: 230px; display: grid; place-items: center; isolation: isolate; }
.mixstage .bwrap { position: absolute; height: 170px; }
.mixstage .la { animation: la 1.6s cubic-bezier(.3, 1, .4, 1) both; }
.mixstage .lb { animation: lb 1.6s cubic-bezier(.3, 1, .4, 1) both; }
.mixstage .orb { position: absolute; width: 140px; height: 140px; border-radius: 50%; filter: blur(26px); opacity: 0; animation: orb 1.2s 1s ease-out forwards, breathe 5s 2.2s ease-in-out infinite; z-index: -1; }
.score { font: 200 52px var(--sf); letter-spacing: -.05em; color: var(--accent-deep); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp > div { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.cmp .bwrap { height: 130px; }
.cmp b { font: 500 15px/1.2 var(--sf); }
.cmp small { color: var(--muted); font-size: 12px; }

/* ---------- Story ---------- */
#story { position: fixed; inset: 0; z-index: 50; color: var(--ink); overflow: hidden; --h: 356; --hA: 8; --hB: 340; --h2: 350; isolation: isolate; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  background: radial-gradient(110% 70% at 50% 26%, hsl(var(--h) 66% 26% / .95), transparent 72%), radial-gradient(90% 55% at 88% 100%, hsl(var(--hA) 60% 20% / .9), transparent 70%), radial-gradient(70% 40% at 0% 90%, hsl(var(--hB) 50% 16% / .8), transparent 70%), #060608; }
#story[hidden] { display: none; }
#story .sb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; animation: drift 14s ease-in-out infinite alternate; }
#story .sb1 { width: 340px; height: 340px; background: hsl(var(--h) 70% 40% / .28); top: -80px; right: -100px; }
#story .sb2 { width: 300px; height: 300px; background: hsl(var(--h2) 60% 32% / .22); bottom: -60px; left: -100px; animation-delay: -5s; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(26px, 22px) scale(1.15); } }
.prog { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; gap: 5px; z-index: 3; }
.prog b { flex: 1; height: 2px; background: rgba(242, 235, 224, .2); overflow: hidden; }
.prog b i { display: block; height: 100%; background: var(--accent-deep); transform-origin: left; transform: scaleX(0); }
.prog b.done i { transform: scaleX(1); }
.prog b.act i { animation: fillp var(--dur, 8s) linear forwards; }
.prog b.act.hold i { transform: scaleX(1); animation: none; }
.paused .prog b.act i { animation-play-state: paused; }
@keyframes fillp { to { transform: scaleX(1); } }
.st-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 26px); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
.st-x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(242, 235, 224, .25); background: rgba(0, 0, 0, .3); color: var(--ink); font-size: 15px; }
#stage { position: absolute; inset: 0; z-index: 1; padding: calc(env(safe-area-inset-top, 0px) + 78px) 26px calc(env(safe-area-inset-bottom, 0px) + 30px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
#stage h2 { font: 200 clamp(40px, 12vw, 60px)/1 var(--sf); letter-spacing: -.045em; text-wrap: balance; }
#stage .lead { font: 300 clamp(24px, 6.6vw, 32px)/1.22 var(--sf); letter-spacing: -.02em; text-wrap: balance; }
#stage .soft { color: rgba(242, 235, 224, .68); font-size: 15px; letter-spacing: .04em; }
#stage .mono, .st-top .mono { color: var(--accent); }
#stage .chips .chip { background: transparent; border-color: rgba(242, 235, 224, .28); color: var(--ink); cursor: default; }
.rise { animation: srise 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes srise { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } }
.pop { animation: spop .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes spop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.w { display: inline-block; animation: srise .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 70ms + var(--d, 0) * 1ms); }
.center { text-align: center; align-items: center; }
.hero-bottle { position: relative; height: min(38vh, 320px); display: grid; place-items: center; isolation: isolate; animation: spop 1.3s cubic-bezier(.2, .8, .2, 1) both; }
.hero-bottle .bwrap { height: 100%; }
.hero-bottle .aura { background: hsl(var(--h) 70% 45% / .5); inset: 6% 8%; }
.vibes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vibes span { font: 400 12px var(--sf); letter-spacing: .16em; text-transform: uppercase; padding: 7px 14px; border: 1px solid rgba(242, 235, 224, .3); }
.load-orbit { position: relative; height: 230px; display: grid; place-items: center; }
.load-orbit .bwrap { position: absolute; height: 120px; animation: orbit 7s linear infinite; }
@keyframes orbit { 0% { transform: rotate(0) translateX(84px) rotate(0) scale(.85); opacity: .5; } 50% { opacity: 1; } 100% { transform: rotate(360deg) translateX(84px) rotate(-360deg) scale(.85); opacity: .5; } }
.msgs { position: relative; height: 34px; }
.msgs span { position: absolute; inset: 0; font: 300 22px var(--sf); animation: msg 6.4s infinite; opacity: 0; letter-spacing: -.01em; }
@keyframes msg { 0% { opacity: 0; transform: translateY(10px); } 6%, 26% { opacity: 1; transform: none; } 32%, 100% { opacity: 0; transform: translateY(-10px); } }
.pyr { display: grid; gap: 12px; }
.pyr .lv { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(242, 235, 224, .18); }
.pyr .lv b { font: 300 21px/1.25 var(--sf); letter-spacing: -.01em; }
.meter-s { display: flex; gap: 6px; align-items: center; }
.meter-s i { width: 8px; height: 8px; border-radius: 50%; background: rgba(242, 235, 224, .2); }
.meter-s i.f { background: var(--accent-deep); }
.merge { position: relative; height: 290px; display: grid; place-items: center; }
.merge .bwrap { position: absolute; height: 200px; }
.merge .la { animation: la 1.8s cubic-bezier(.3, 1, .4, 1) both; }
.merge .lb { animation: lb 1.8s cubic-bezier(.3, 1, .4, 1) both; }
@keyframes la { from { transform: translateX(-140%) rotate(-10deg); opacity: 0; } to { transform: translateX(-54%) rotate(3deg); } }
@keyframes lb { from { transform: translateX(140%) rotate(10deg); opacity: 0; } to { transform: translateX(54%) rotate(-3deg); } }
.merge .orb { position: absolute; width: 160px; height: 160px; border-radius: 50%; filter: blur(28px); opacity: 0; animation: orb 1.4s 1.2s ease-out forwards, breathe 5s 2.6s ease-in-out infinite; z-index: -1; }
@keyframes orb { to { opacity: .8; } }
.plus { position: absolute; font: 200 44px var(--sf); opacity: 0; color: var(--accent-deep); animation: orb .6s 1.5s forwards; }
.steps { display: grid; gap: 10px; }
.steps div { display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 15px; color: rgba(242, 235, 224, .85); }
.steps div b { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent-deep); display: grid; place-items: center; font: 500 11px var(--sf); }
.st-btn { border: 0; border-radius: 3px; padding: 16px 22px; font: 600 12.5px var(--sf); letter-spacing: .2em; text-transform: uppercase; background: var(--accent); color: #14100c; }
.st-btn.line { background: transparent; color: var(--ink); border: 1px solid rgba(242, 235, 224, .3); }
.altrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border: 1px solid rgba(242, 235, 224, .2); background: rgba(255, 255, 255, .03); text-align: left; color: var(--ink); width: 100%; border-radius: 4px; }
.altrow .bwrap { height: 64px; }
.altrow b { font: 500 17px/1.2 var(--sf); display: block; }
.altrow small { color: rgba(242, 235, 224, .65); }
.petal { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 80% 0 80% 0; animation: fall linear forwards; z-index: 5; pointer-events: none; }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); opacity: .9; } }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#story canvas.fx { z-index: 0; opacity: .4; }
#story::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(to top, rgba(6, 6, 8, .78) 0%, rgba(6, 6, 8, .5) 36%, transparent 64%); }
#stage .lead, #stage h2, #stage .steps, #stage .pyr { text-shadow: 0 1px 16px rgba(0, 0, 0, .55); }
.pcard canvas.fx, .rec canvas.fx, .vit canvas.fx { z-index: 0; opacity: .34; }
.pcard > *:not(canvas), .rec > *:not(canvas), .vit button > *:not(canvas) { position: relative; z-index: 1; }
.big-bottle canvas.fx { opacity: .5; inset: -30px -20px; width: calc(100% + 40px); height: calc(100% + 60px); z-index: -1; }
.motif { font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: rgba(242, 235, 224, .6); }

/* ---------- Ouverture ---------- */
#splash { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: #080605; color: var(--ink); animation: splashOut .9s 2.4s ease-in forwards; }
#splash .lg { font: 200 clamp(34px, 11vw, 60px)/1 var(--sf); letter-spacing: .34em; text-transform: uppercase; display: flex; margin-right: -.34em; }
#splash .lg span { display: inline-block; animation: srise 1.3s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
#splash .tg { margin-top: 18px; text-align: center; font: 500 11px var(--sf); letter-spacing: .3em; text-transform: uppercase; color: var(--accent); animation: srise 1.2s 1.3s both; }
#splash svg { display: block; margin: 20px auto 0; width: 180px; height: 12px; overflow: visible; }
#splash svg path { stroke-dasharray: 260; stroke-dashoffset: 260; animation: dash 1.8s .7s ease-out forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .msgs span:first-child { opacity: 1; }
}

/* ---------- Balade, wishlist ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 3px; margin-top: 18px; }
.seg button { border: 0; background: none; padding: 12px 8px; font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: rgba(180, 57, 74, .16); color: var(--accent-deep); }
.wcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); text-align: left; }
.wcard b { display: block; font: 500 16px var(--sf); }
.wcard small { color: var(--muted); font-size: 12.5px; }

.symhint { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; }
.sym { display: block; }
.sym.big { color: var(--accent-deep); animation: symdraw 1s ease-out both; }
@keyframes symdraw { from { opacity: 0; transform: scale(.85) rotate(-6deg); } }
.wadd { display: grid; gap: 14px; }
.wentry { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); animation: rise .6s both; }
.wentry:has(.wthumb) { grid-template-columns: 56px 1fr 64px; }

.wbody { display: grid; gap: 4px; min-width: 0; }
.wbody b { font: 500 16px/1.2 var(--sf); }
.wbody small { color: var(--muted); font-size: 12.5px; }
.wbody p { font-size: 14px; color: var(--ink); opacity: .85; }
.wthumb { width: 64px; height: 80px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.symgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.symtile { display: grid; justify-items: center; gap: 4px; padding: 12px 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--accent-deep); }

.wl { display: grid; grid-template-columns: 84px 1fr; gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); animation: rise .6s both; animation-delay: calc(var(--i) * 70ms); align-items: center; }

    'boisé|musqué': 2, 'boisé|épicé': 2, 'boisé|cuir': 2.5, 'boisé|oud': 2,
    'épicé|cuir': 2, 'épicé|musqué': 1.5, 'cuir|oud': 1.5, 'cuir|musqué': 1.5, 'oud|musqué': 1.5,
  };

    vert: 'une touche verte et végétale', floral: 'de la rondeur florale', fruité: 'un côté juteux et joyeux', gourmand: 'de la douceur et du confort',
    ambré: 'de la chaleur et du sillage', boisé: 'de la profondeur et de l\'élégance', épicé: 'du relief et du caractère', cuir: 'une pointe de caractère et de mystère',
    musqué: 'un effet « seconde peau », doux et propre', oud: 'du mystère et de la densité',
  };

  function pairScore(a, b, heat) {
    const key = [a.family, b.family].sort().join('|');

        b, total, level: lvl, what: what + bridge,

  // ---------- Profil de goûts / achats ----------
  function tasteProfile(collection, settings) {
    const fam = {}, note = {};

      if (p.family) fam[p.family] = (fam[p.family] || 0) + w;

    for (const n of settings.liked || []) note[norm(n)] = (note[norm(n)] || 0) + 2;
    for (const n of settings.avoid || []) note[norm(n)] = (note[norm(n)] || 0) - 3;

  }

  const SCENARIOS = [
    { id: 's1', label: 'journée pro en été', c: { temp: 28, ctx: 'pro', with: 'collegues', moment: 'jour', mood: 'confiant', style: 'smart', color: 'clair', fabric: 'coton' } },
    { id: 's2', label: 'soirée date en hiver', c: { temp: 4, ctx: 'date', with: 'partenaire', moment: 'soir', mood: 'romantique', style: 'soiree', color: 'sombre', fabric: 'laine' } },
    { id: 's3', label: 'événement / soirée statement', c: { temp: 15, ctx: 'event', with: 'inconnus', moment: 'soir', mood: 'confiant', style: 'soiree', color: 'sombre', fabric: 'soie' } },
    { id: 's4', label: 'sortie entre amis à la mi-saison', c: { temp: 16, ctx: 'amis', with: 'amis', moment: 'jour', mood: 'joyeux', style: 'casual', color: 'colore', fabric: 'denim' } },

    { id: 's8', label: 'moment famille cocooning', c: { temp: 11, ctx: 'famille', with: 'famille', moment: 'jour', mood: 'fatigue', style: 'casual', color: 'neutre', fabric: 'laine' } },
  ];

  function coverage(collection) {
    return SCENARIOS.map((sc) => {
      let best = -Infinity, bestP = null;
      for (const p of collection) { const s = score(p, sc.c).total; if (s > best) { best = s; bestP = p; } }

    const cov = coverage(collection);
    const owned = new Set(collection.map((p) => norm(p.name)));

      dr(c, P, k) { const r = P.s * (1 + P.age * 1.6), a = Math.sin(Math.min(1, P.age) * Math.PI) * k.smokeA; const g = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, r); g.addColorStop(0, `rgba(${k.smoke},${a})`); g.addColorStop(1, `rgba(${k.smoke},0)`); c.fillStyle = g; c.beginPath(); c.arc(P.x, P.y, r, 0, 6.29); c.fill(); } },

  root.FX = { attach, clear, motifsOf };
})(window);

  async function analyzeAdd(pn) {
    const txt = $('#addtxt', pn).value.trim(), out = $('#addres', pn);
    if (!txt && !SHELF_FILES.length) { $('#addtxt', pn).focus(); return; }
    out.innerHTML = '<div class="shim"></div><div class="shim" style="width:80%"></div><div class="shim" style="width:60%"></div>'; $('#addgo', pn).disabled = true;
    let items = null;
    try {
      const prompt = `Tu es un expert en parfumerie (niche et designer). L'utilisateur ajoute des parfums à sa collection, en vrac${SHELF_FILES.length ? ' et via photo(s) de flacons ou d\'étagère' : ''}. Texte saisi : """${txt || '(aucun)'}"""\nIdentifie chaque parfum (corrige les fautes, complète la maison). Réponds UNIQUEMENT par un JSON : {"items":[{"name":"nom officiel","house":"maison","family":"${FAMS}","notes":["5 notes en français, de l'ouverture au fond"],"projection":1-5,"longevity":1-5,"weight":1-5 (1 frais et léger, 5 chaud et dense),"price":nombre en euros indicatif,"confidence":0 à 1}]}. Si tu ne reconnais pas un parfum, mets confidence sous 0.4 et ta meilleure estimation.`;
      const j = await aiJson(prompt, { modelTier: 'default', images: SHELF_FILES.length && CAN_IMG ? SHELF_FILES : undefined });
      items = (j.items || []).map((it) => ({ id: uid(), name: String(it.name || '').trim(), house: String(it.house || '').trim(), family: E.FAMILIES[it.family] ? it.family : 'boisé', notes: (it.notes || []).map(String).slice(0, 6), projection: clamp(Math.round(+it.projection || 3), 1, 5), longevity: clamp(Math.round(+it.longevity || 3), 1, 5), weight: clamp(Math.round(+it.weight || 3), 1, 5), price: Math.round(+it.price) || 0, rating: 4, occ: [], conf: +it.confidence || 0.7 })).filter((it) => it.name);
    } catch (e) {
      const lines = txt.split(/\n|,/).map((s) => s.trim()).filter(Boolean);
      items = lines.map((l) => {
        const n = E.norm(l); const c = CAT.find((x) => E.norm(x.name) === n) || CAT.find((x) => n.length >= 4 && (E.norm(x.name).includes(n) || n.includes(E.norm(x.name))));
        return c ? Object.assign(fromCat(c, 4), { conf: 0.9 }) : null;
      }).filter(Boolean);
      out.insertAdjacentHTML('beforebegin', '<p class="mono" style="text-transform:none">L\'IA n\'est pas disponible ici : seuls les parfums du catalogue sont reconnus.</p>');
    }
    items = items.filter((it) => !S.collection.some((p) => E.norm(p.name) === E.norm(it.name)));
    PRE = items;
    out.innerHTML = items.length ? items.map((it, i) => `<div class="pre" style="--i:${i}">${bt(it, { still: true })}<div><b>${esc(it.name)}</b><small>${esc(it.house)} · ${esc(famLabel(it.family))}${it.conf < 0.4 ? ' · à vérifier' : ''}</small></div><button class="ghost" data-rm="${i}" aria-label="Retirer">✕</button></div>`).join('') + `<button class="cta full" id="addok"><span>Ajouter ${items.length} parfum${items.length > 1 ? 's' : ''}</span></button>` : '<div class="empty">Rien de nouveau reconnu. Essaie avec le nom et la maison.</div>';
    $$('[data-rm]', out).forEach((b) => (b.onclick = () => { PRE[+b.dataset.rm] = null; b.closest('.pre').remove(); }));
    if ($('#addok', out)) $('#addok', out).onclick = () => { PRE.filter(Boolean).forEach((it) => { delete it.conf; S.collection.push(it); }); save(); closeSheet(); tab = 'shelf'; render(); };
    $('#addgo', pn).disabled = false;
  }

  // ---------- Photos réelles (assets) ----------
  async function shrink(file, max) {
    const bmp = await createImageBitmap(file), k = Math.min(1, (max || 900) / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((r) => c.toBlob(r, 'image/jpeg', .86));
  }
  async function putPhoto(file) {
    const c = window.claude, A = c && c.use ? await c.use('assets') : null; if (!A) throw { code: 'unavailable' };
    const r = await A.upload(await shrink(file, 900)); return r.id;
  }

  // ---------- Journée : IA + repli local ----------
  const pickKey = (v, obj, d) => (typeof v === 'string' && v in obj ? v : d);
  function normCond(c, wx) {
    c = c || {};
    return { ctx: pickKey(c.ctx, E.CONTEXTS, 'perso'), with: pickKey(c.with, E.WITHS, 'seul'), moment: pickKey(c.moment, E.MOMENTS, 'jour'), mood: pickKey(c.mood, E.MOODS, 'confiant'), style: pickKey(c.style, E.STYLES, 'smart'), color: pickKey(c.color, E.COLORS, 'neutre'), fabric: pickKey(c.fabric, E.FABRICS, ''), temp: typeof c.temp === 'number' ? c.temp : wx ? wx.t : 18, rain: !!(wx && wx.rain) || !!c.rain, hum: 50 };
  }
  function keywordCond(text, wx) {
    const t = E.norm(text), c = { temp: wx ? wx.t : 18 };
    const m = text.match(/(-?\d{1,2})\s*°/); if (m) c.temp = +m[1];
    if (/pro|reunion|bureau|client|travail|entretien|teletravail/.test(t)) c.ctx = 'pro';
    if (/date|rencard|resto|diner|amoureu|copine|copain|chéri|cheri/.test(t)) c.ctx = 'date';
    if (/famille|parents|mamie|papa|maman/.test(t)) c.ctx = 'famille';
    if (/ami|pote|bar|apero|brunch|terrasse/.test(t)) c.ctx = 'amis';
    if (/mariage|vernissage|gala|soiree|evenement|concert/.test(t)) c.ctx = 'event';
    if (/soir|diner|vernissage|nuit/.test(t)) c.moment = 'soir';
    if (/costume|blazer/.test(t)) c.style = 'costume'; else if (/sport|running|salle/.test(t)) c.style = 'sport'; else if (/jean|t shirt|tee/.test(t)) c.style = 'casual';
    if (/cuir|perfecto/.test(t)) c.fabric = 'cuir'; else if (/lin/.test(t)) c.fabric = 'lin'; else if (/pull|maille|laine/.test(t)) c.fabric = 'laine';
    if (/pluie|pleut/.test(t)) c.rain = true;
    if (/froid/.test(t) && !m) c.temp = 4; if (/chaud|canicule/.test(t) && !m) c.temp = 29;
    return normCond(c, wx);
  }
  const layerObjs = (p, cond, n) => E.layering(p, S.collection, cond, { daysSince }, n || 2).map((l) => ({ p: l.b, effect: l.what, how: [l.how, l.tip].filter(Boolean).join(' '), score: clamp(Math.round(l.total + 1.5), 2, 5) }));
  function localDay(text, wx) {
    const cond = keywordCond(text, wx);
    const rk = E.rank(S.collection, cond, { daysSince });
    const top = rk[0];
    return { cond, read: text ? text : 'Journée ' + E.CONTEXTS[cond.ctx].toLowerCase() + ', ' + Math.round(cond.temp) + '°', pick: top.p, vibe: [famLabel(top.p.family), E.MOODS[cond.mood], (E.MOMENTS[cond.moment] || '').toLowerCase()].filter(Boolean).slice(0, 3),
      story: (top.reasons.slice(0, 3).join('. ') || 'Le meilleur compromis de ton étagère aujourd\'hui') + '.', alts: rk.slice(1, 4).map((r) => ({ p: r.p, line: r.reasons[0] || 'Une belle alternative' })), layers: layerObjs(top.p, cond, 2), avoid: '', ai: false };
  }
  async function aiDay(text, wx) {
    const prompt = `Tu es un nez de parfumerie qui compose avec goût. Ton chaleureux, tutoiement, image sensorielle, jamais de jargon creux. Réponds UNIQUEMENT par un JSON.\n\nMa collection (id | nom | maison | famille | notes | projection | tenue | poids | ma note | dernier port) :\n${colLines()}\n\nMa journée : """${text || '(non précisée)'}"""${wx ? `\nMétéo indiquée : ${wx.l}, environ ${wx.t}°C${wx.rain ? ', pluie' : ''}.` : ''}${PHOTO && CAN_IMG ? '\nUne photo de ma tenue est jointe : lis-y les couleurs, matières et le style.' : ''}\nDate : ${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}.\n\nFormat : {"cond":{"temp":nombre ou null,"ctx":"pro|perso|date|event|famille|amis","with":"seul|partenaire|premier|collegues|boss|famille|amis|inconnus","moment":"jour|soir|nuit","mood":"confiant|calme|energique|romantique|mysterieux|joyeux|fatigue|creatif","style":"costume|smart|casual|sport|soiree|street","color":"sombre|neutre|clair|colore","fabric":"coton|lin|laine|cuir|denim|soie|technique|"},"read":"ma journée reformulée, 12 mots max","pick":"id du parfum","vibe":["3 mots courts"],"story":"2 phrases : pourquoi celui-là aujourd'hui (météo, tenue, moment, personnes)","alts":[{"id":"","line":"8 mots max"},{"id":"","line":""}],"layers":[{"id":"","effect":"ce que l'accord change, 1 phrase","how":"ordre, dosage en sprays, où vaporiser selon la tenue, 2 phrases","score":1-5},{"id":"","effect":"","how":"","score":1-5}],"avoid":"vide, ou 1 phrase si un parfum est à éviter aujourd'hui"}\nRègles : n'utilise que les id fournis. Évite ce qui a été porté hier ou aujourd'hui sauf raison forte. Les 2 accords de layering doivent être différents de "pick" et cohérents avec la chaleur et la tenue.`;
    const j = await aiJson(prompt, { modelTier: 'default', images: PHOTO && CAN_IMG ? [PHOTO] : undefined });
    const p = find(j.pick); if (!p) throw { code: 'bad_pick' };
    const cond = normCond(j.cond, wx);
    let layers = (j.layers || []).map((l) => ({ p: find(l.id), effect: String(l.effect || ''), how: String(l.how || ''), score: clamp(Math.round(+l.score || 4), 1, 5) })).filter((l) => l.p && l.p.id !== p.id).slice(0, 2);
    if (!layers.length) layers = layerObjs(p, cond, 2);
    let alts = (j.alts || []).map((a) => ({ p: find(a.id), line: String(a.line || '') })).filter((a) => a.p && a.p.id !== p.id).slice(0, 3);
    if (!alts.length) alts = E.rank(S.collection, cond, { daysSince }).filter((r) => r.p.id !== p.id).slice(0, 3).map((r) => ({ p: r.p, line: r.reasons[0] || '' }));
    return { cond, read: String(j.read || text || 'Ta journée'), pick: p, vibe: (j.vibe || []).map(String).slice(0, 3), story: String(j.story || ''), alts, layers, avoid: String(j.avoid || ''), ai: true };
  }

  let LAST = null;
  async function runDay(replayFor) {
    if (!S.collection.length) { tab = 'shelf'; render(); return; }
    openStory(); showLoading();
    let R = null;
    const t0 = Date.now();
    try { R = await aiDay(SAY.trim(), WX); } catch (e) { R = null; }
    if (!R) R = localDay(SAY.trim(), WX);
    const wait = 1800 - (Date.now() - t0); if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    LAST = R; showStory(R);
  }

  // ---------- Story ----------
  let ST = null;
  function openStory() {

    el.innerHTML = `<i class="sb sb1"></i><i class="sb sb2"></i><canvas class="fx" id="fx" aria-hidden="true"></canvas><div class="prog" id="prog"></div><div class="st-top"><span class="mono" id="stlabel">sillage</span><button class="st-x" id="stx" aria-label="Fermer">✕</button></div><div id="stage"></div>`;

  }
  function closeStory() { $('#story').hidden = true; $('#story').innerHTML = ''; ST = null; document.body.style.overflow = ''; render(true); }
  function setHue(p) {
    const w = (x) => { x = Art.noGreen(x); return x > 14 && x < 64 ? 352 + (x - 14) * 0.2 : x; }, h = w(Art.pal(p).h), st = $('#story').style;
    st.setProperty('--h', h); st.setProperty('--hA', w(h + 34)); st.setProperty('--hB', w(h - 26)); st.setProperty('--h2', w(h + 70));
  }
  function showLoading() {
    const ps = [...S.collection].sort(() => Math.random() - 0.5).slice(0, 3);
    setHue(ps[0]); FX.attach($('#fx'), ps[0], { dark: true, density: .8 });
    $('#stage').innerHTML = `<div class="load-orbit center">${ps.map((p, i) => bt(p, { still: true, style: `animation-delay:${-i * 2.33}s` })).join('')}</div>
      <div class="msgs center">${['Je lis ta journée…', 'Je sens ton étagère…', 'Je compose l\'accord…'].map((m, i) => `<span style="animation-delay:${i * 2.1}s">${m}</span>`).join('')}</div>`;
    $('#prog').innerHTML = '';
  }
  const condChips = (c) => [E.CONTEXTS[c.ctx], E.WITHS[c.with], E.MOMENTS[c.moment], Math.round(c.temp) + '°', E.MOODS[c.mood], E.STYLES[c.style] + (c.fabric ? ' · ' + E.FABRICS[c.fabric].toLowerCase() : '')];
  function buildScenes(R) {
    const p = R.pick, sc = [];

  function walkEdit(w, e) {
    let rate = e.rating;
    const pn = openSheet(`<div><h2>Modifier la touche</h2><p class="mono" style="margin-top:6px">${symSvg(e.sym, 22)} ${esc(SYMS[e.sym][0])}</p></div><input type="text" id="en" value="${esc(e.name)}"><textarea id="eno" rows="3">${esc(e.note || '')}</textarea>
      <div class="chips" id="er">${Object.entries(RATE).map(([k, v]) => `<button class="chip ${rate === k ? 'on' : ''}" data-r="${k}">${v}</button>`).join('')}</div>
      <div class="row" style="justify-content:space-between"><button class="ghost danger" id="edel">Supprimer</button><button class="cta" id="esave"><span>Enregistrer</span></button></div>`);
    $$('#er .chip', pn).forEach((c) => (c.onclick = () => { rate = c.dataset.r; $$('#er .chip', pn).forEach((x) => x.classList.toggle('on', x === c)); }));
    $('#esave', pn).onclick = () => { e.name = $('#en', pn).value.trim() || e.name; e.note = $('#eno', pn).value.trim(); e.rating = rate; save(); closeSheet(); viewWalk(); };
    $('#edel', pn).onclick = (ev) => { if (!ev.target.dataset.sure) { ev.target.dataset.sure = 1; ev.target.textContent = 'Confirmer'; return; } w.entries = w.entries.filter((x) => x.id !== e.id); save(); closeSheet(); viewWalk(); };
  }
  async function walkSummary(w) {
    const out = $('#wsumres'); out.innerHTML = '<div class="shim"></div><div class="shim" style="width:70%"></div>'; $('#wSum').disabled = true;
    const lines = w.entries.map((e) => `${e.name} | ${e.house} | ${e.notes.join(', ')} | ${RATE[e.rating]} | ${e.note || ''}`).join('\n');
    try {
      const j = await aiJson(`Tu es un nez de parfumerie. Voici les parfums que j'ai sentis pendant une balade en boutique (nom | maison | notes | mon avis | ma remarque) :\n${lines}\n\nMa collection actuelle :\n${colLines()}\n\nRéponds UNIQUEMENT par un JSON : {"taste":"ce que mes avis révèlent de mes goûts, 2 phrases, tutoiement","keep":[{"name":"nom exact d'une touche à retenir","why":"pourquoi, 10 mots max"}],"skip":"ce que je peux oublier, 1 phrase"}`, { modelTier: 'default' });
      const keep = (j.keep || []).map((k) => ({ k, e: w.entries.find((e) => E.norm(e.name) === E.norm(k.name)) })).filter((x) => x.e);
      out.innerHTML = `<p style="font-size:17px;font-weight:300">${esc(j.taste || '')}</p>${keep.map((x) => `<div class="wentry"><div class="wsym">${symSvg(x.e.sym, 32)}</div><div class="wbody"><b>${esc(x.e.name)}</b><small>${esc(x.k.why || '')}</small><div class="row" style="margin-top:8px"><button class="ghost" data-kw="${x.e.id}">${hasWish(x.e.name) ? 'Dans la wishlist' : 'Wishlist'}</button></div></div></div>`).join('')}${j.skip ? `<p class="mono" style="text-transform:none;letter-spacing:0">${esc(j.skip)}</p>` : ''}`;
      $$('[data-kw]', out).forEach((b) => (b.onclick = () => { const e = w.entries.find((x) => x.id === b.dataset.kw); addWish(CAT.find((c) => E.norm(c.name) === E.norm(e.name)) ? wishFromName(CAT.find((c) => E.norm(c.name) === E.norm(e.name)).name) : e); b.textContent = 'Dans la wishlist'; }));
    } catch (er) {
      const loved = w.entries.filter((e) => e.rating === 'love');
      out.innerHTML = `<p style="color:var(--muted)">${loved.length ? 'Tes coups de cœur : ' + esc(loved.map((e) => e.name).join(', ')) + '.' : 'Aucun coup de cœur noté pour l\'instant.'}</p>`;
    }
    $('#wSum').disabled = false;
  }

  // ---------- Démarrage ----------
  $('#dock').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); } });
  $('#profileBtn').onclick = openProfile;
  render();
  initStore();
  initAI();
  autoWeather();
  const sp = $('#splash');
  if (sp) { const kill = () => sp.remove(); sp.addEventListener('click', kill); setTimeout(kill, REDUCED ? 500 : 3000); }
})();

</script>
