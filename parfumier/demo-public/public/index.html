<style>
/* Sillage — cabinet de parfumeur : noir chaud, or champagne, oxblood, typographie SF.
   Aucun vert, aucun pastel. Traits fins, angles francs, mouvement lent. Thème sombre unique. */
:root {
  color-scheme: dark;
  --bg: #08080a; --surface: #131215; --surface2: #1a181c; --ink: #f4f0ea; --muted: #94908a;
  --line: rgba(255, 255, 255, .10); --line2: rgba(255, 255, 255, .22);
  --accent: #e9e1d4; --accent-soft: rgba(233, 225, 212, .07); --accent-deep: #f6f1e8; --wine: #b4394a;
  --oxblood: #6f1d29;
  --cta-bg: #efe8dc; --cta-fg: #0d0b0c; --glass: rgba(12, 11, 13, .84);
  --sf: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --f-display: var(--sf); --f-body: var(--sf); --f-mono: var(--sf);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sf); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(90% 46% at 50% -8%, rgba(122, 31, 43, .42), transparent 70%), radial-gradient(80% 40% at 100% 100%, rgba(44, 54, 76, .34), transparent 72%); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.mono { font: 500 11px var(--sf); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

/* ---------- Coque ---------- */
#app { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-bottom: 120px; }
.bar { display: flex; align-items: center; justify-content: space-between; padding-block: 20px 8px; }
.mark { font: 600 14px var(--sf); letter-spacing: .38em; text-transform: uppercase; color: var(--accent-deep); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--muted); }
.iconbtn svg { width: 19px; height: 19px; }
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100vw - 32px));
  display: grid; grid-template-columns: repeat(6, 1fr); border-radius: 4px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid var(--line); z-index: 20; }
.dock button { position: relative; z-index: 1; border: 0; background: none; padding: 11px 2px 10px; display: grid; justify-items: center; gap: 3px; font-size: 9px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); transition: color .3s; }
.dock button svg { width: 20px; height: 20px; }
.dock button.on { color: var(--accent-deep); }
.dock .ind { position: absolute; left: 0; bottom: 0; height: 2px; width: 16.6667%; background: var(--wine); transition: transform .5s cubic-bezier(.2, .8, .2, 1); }

/* ---------- Composants ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
.sec { margin-top: 34px; display: grid; gap: 14px; }
.sec > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec h2 { font: 300 26px/1.1 var(--sf); letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 3px; padding: 9px 14px; font-size: 13.5px; transition: border-color .25s, background .25s; text-align: left; }
.chip:hover { border-color: var(--line2); }
.chip.on { background: rgba(180, 57, 74, .16); border-color: var(--wine); color: var(--accent-deep); }
.cta { position: relative; overflow: hidden; border: 0; border-radius: 3px; background: var(--cta-bg); color: var(--cta-fg); padding: 16px 24px; font: 600 12.5px var(--sf); letter-spacing: .2em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.cta:active { transform: scale(.985); }
.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .38) 50%, transparent 65%); transform: translateX(-130%); animation: sheen 5s ease-in-out infinite; }
@keyframes sheen { 55%, 100% { transform: translateX(130%); } }
.cta.full { width: 100%; }
.cta[disabled] { opacity: .5; }
.ghost { border: 1px solid var(--line2); background: transparent; border-radius: 3px; padding: 10px 16px; font: 500 11.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.ghost.danger { color: #d8897a; border-color: rgba(216, 137, 122, .4); }
textarea, input[type=text], input[type=search], input[type=email], input[type=password], select { width: 100%; font: 16px/1.45 var(--sf); color: var(--ink); background: #1e1c22; border: 1px solid var(--line2); border-radius: 4px; padding: 14px 16px; resize: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); transition: border-color .25s, box-shadow .25s; }
textarea::placeholder, input::placeholder { color: #b9b4ad; opacity: 1; }
textarea:focus, input[type=text]:focus, input[type=search]:focus, input[type=email]:focus, input[type=password]:focus, select:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px rgba(180, 57, 74, .22); }
.fieldlab { display: flex; align-items: center; gap: 8px; font: 600 11px var(--sf); letter-spacing: .16em; text-transform: uppercase; color: var(--accent-deep); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(214, 186, 140, .2); }
.dots i.f { background: var(--accent); }
.tag { font: 500 10.5px var(--sf); letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); }
.empty { padding: 26px 8px; text-align: center; color: var(--muted); }
.spark { display: none; }
.linkbtn { color: var(--accent-deep); font: 500 12px var(--sf); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid var(--line2); padding-bottom: 2px; }

/* ---------- Accueil ---------- */
.hero { position: relative; margin-top: 26px; }
.hero .blob { display: none; }
.hero h1 { font: 200 clamp(46px, 14vw, 68px)/1 var(--sf); letter-spacing: -.045em; margin: 6px 0 4px; }
.hero h1 em { font-style: normal; color: var(--accent-deep); font-weight: 300; }
.hero .q { font: 300 21px/1.3 var(--sf); color: var(--muted); letter-spacing: -.01em; margin-bottom: 20px; }
.say-wrap { display: grid; gap: 14px; }
.say-wrap textarea { min-height: 104px; padding: 16px; font-size: 17px; font-weight: 300; animation: nudge 3.2s ease-in-out infinite; }
.say-wrap textarea:focus { animation: none; }
@keyframes nudge { 0%, 100% { border-color: var(--line2); } 50% { border-color: rgba(180, 57, 74, .8); } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.photo-btn { display: inline-flex; align-items: center; gap: 8px; }
.photo-btn svg { width: 16px; height: 16px; }
.photo-btn img { width: 22px; height: 22px; border-radius: 2px; object-fit: cover; }
.today-card { display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; }
.strip { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 82px; text-align: center; scroll-snap-align: start; font-size: 11.5px; color: var(--muted); }
.mini .bwrap { height: 92px; }
.mini b { display: block; color: var(--ink); font-weight: 500; font-size: 12px; line-height: 1.2; margin-top: 6px; }
.vit { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -20px; padding: 6px 20px 10px; scrollbar-width: none; }
.vit::-webkit-scrollbar { display: none; }
.vit button { flex: 0 0 148px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 4px; background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .3)); padding: 16px 10px 12px; text-align: center; position: relative; overflow: hidden; }
.vit .bwrap { height: 190px; }
.vit b { display: block; font: 500 13px/1.2 var(--sf); margin-top: 12px; }
.vit small { color: var(--muted); font-size: 11.5px; letter-spacing: .04em; }
.jr { display: grid; gap: 12px; }
.jr textarea { min-height: 70px; }

/* ---------- Flacons ---------- */
.bwrap { display: block; margin-inline: auto; position: relative; width: fit-content; max-width: 100%; }
.bwrap svg { display: block; height: 100%; width: auto; margin-inline: auto; overflow: visible; }
.bob { animation: bob 7s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.8deg); } 50% { transform: translateY(-6px) rotate(.8deg); } }
.wv.w1 { animation: wave 5s linear infinite; }
.wv.w2 { animation: wave 7.5s linear infinite reverse; }
@keyframes wave { from { transform: translateX(-120px); } to { transform: translateX(0); } }
.shine { animation: shine 8s ease-in-out infinite; }
@keyframes shine { 0%, 100% { transform: translateX(0); opacity: .42; } 50% { transform: translateX(34px); opacity: .1; } }
.lbub { animation: lrise 6s linear infinite; opacity: 0; transform-box: fill-box; }
@keyframes lrise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(var(--rise)); opacity: 0; } }
.mist { opacity: 0; transform-box: fill-box; transform-origin: center; animation: mist 3s ease-out infinite; }
@keyframes mist { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: .85; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.9); } }
.aura { position: absolute; inset: 8% -20%; border-radius: 50%; filter: blur(34px); opacity: .6; animation: breathe 7s ease-in-out infinite; z-index: -1; }
@keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .4; } 50% { transform: scale(1.08); opacity: .7; } }
.bwrap.photo img { object-fit: contain; height: 100%; width: auto; max-width: 100%; display: block; margin-inline: auto; filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .65)); -webkit-box-reflect: below 0 linear-gradient(transparent 78%, rgba(255, 255, 255, .13)); }
.bwrap .mp { position: absolute; left: 50%; width: 0; height: 0; }
.bwrap .mp i { position: absolute; border-radius: 50%; background: rgba(255, 244, 224, .9); opacity: 0; animation: mistp 3s ease-out infinite; }
@keyframes mistp { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: .8; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2); } }

/* ---------- Étagère ---------- */
.ribbon { display: flex; height: 3px; gap: 2px; }
.ribbon i { display: block; height: 100%; animation: grow 1.2s cubic-bezier(.2, .8, .2, 1) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }
.shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pcard { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 16px 12px 14px; text-align: left; overflow: hidden; background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .35)); isolation: isolate; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.pcard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 34%, var(--tint), transparent 68%); opacity: .5; z-index: -1; }
.pcard .bwrap { height: 168px; margin-bottom: 12px; }
.pcard b { display: block; font: 500 15px/1.2 var(--sf); letter-spacing: -.01em; }
.pcard span { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.pcard:active { transform: scale(.985); }
.add-tile { border: 1px dashed var(--line2); background: transparent; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 8px; min-height: 240px; border-radius: 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.add-tile b { font: 200 40px/1 var(--sf); color: var(--accent); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; }
.stat { padding: 14px 12px 12px; min-width: 0; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font: 300 22px/1.15 var(--sf); letter-spacing: -.03em; overflow-wrap: anywhere; }
.stat span { font: 500 10px var(--sf); color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }

/* ---------- Découvrir ---------- */
.snap { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 20px 16px; margin-inline: -20px; scrollbar-width: none; }
.snap::-webkit-scrollbar { display: none; }
.rec { position: relative; flex: 0 0 82%; max-width: 340px; scroll-snap-align: center; border-radius: 4px; padding: 20px 18px 18px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), rgba(19, 16, 16, .4)); display: grid; gap: 12px; overflow: hidden; isolation: isolate; }
.rec::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 22%, var(--tint), transparent 62%); opacity: .5; z-index: -1; }
.rec .bwrap { height: 170px; }
.rec h3 { font: 400 22px/1.15 var(--sf); letter-spacing: -.02em; }
.rec .why { font-size: 14px; color: var(--muted); }
.rec .why:empty { display: none; }
.pct { position: absolute; top: 14px; right: 14px; font: 500 11px var(--sf); letter-spacing: .12em; color: var(--accent-deep); border: 1px solid var(--line2); padding: 4px 9px; border-radius: 2px; z-index: 2; }
.ask-card { display: grid; gap: 12px; }
.aires { display: grid; gap: 12px; }
.aires .rec { flex: none; max-width: none; grid-template-columns: 96px 1fr; align-items: center; }
.aires .rec .bwrap { height: 130px; }
.shim { background: linear-gradient(100deg, var(--surface2) 30%, #2a221c 50%, var(--surface2) 70%) 0 0 / 300% 100%; border-radius: 2px; height: 14px; animation: shim 1.6s linear infinite; }
@keyframes shim { to { background-position: -300% 0; } }
.buy { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Feuille ---------- */
#sheet { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; }
#sheet[hidden] { display: none; }
#sheet .veil { position: absolute; inset: 0; background: rgba(0, 0, 0, .68); animation: fade .35s both; }
#sheet .panel { position: relative; width: min(620px, 100%); margin-inline: auto; max-height: 90vh; overflow-y: auto; background: #100d0c; border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 12px 20px calc(30px + env(safe-area-inset-bottom, 0px)); animation: up .5s cubic-bezier(.2, .9, .25, 1) both; display: grid; gap: 16px; }
#sheet .grab { width: 40px; height: 3px; border-radius: 2px; background: var(--line2); margin: 0 auto 6px; }
#sheet h2 { font: 300 30px/1.1 var(--sf); letter-spacing: -.03em; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.big-bottle { position: relative; height: 250px; isolation: isolate; }
.big-bottle .bwrap { height: 100%; }
.meter { display: grid; grid-template-columns: 100px 1fr; align-items: center; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.stars button { border: 0; background: none; font-size: 24px; padding: 0 2px; color: var(--accent); }
.pre { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); animation: rise .6s both; animation-delay: calc(var(--i, 0) * 80ms); }
.pre .bwrap { height: 66px; }
.pre b { font: 500 15px/1.2 var(--sf); }
.pre small { color: var(--muted); display: block; }
.wk { display: grid; grid-template-columns: 54px 1fr; gap: 14px; align-items: center; padding: 10px 12px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); animation: rise .6s both; animation-delay: calc(var(--i) * 80ms); }
.wk .bwrap { height: 76px; }
.wk .d { font: 500 10.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-deep); }
.wk b { font: 500 16px/1.2 var(--sf); }
.wk p { font-size: 13px; color: var(--muted); }
.pickrow { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: none; }
.pickrow::-webkit-scrollbar { display: none; }
.pk { flex: 0 0 78px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 8px 4px 6px; text-align: center; font-size: 11px; line-height: 1.2; color: var(--muted); }
.pk .bwrap { height: 80px; }
.pk.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.mixstage { position: relative; height: 230px; display: grid; place-items: center; isolation: isolate; }
.mixstage .bwrap { position: absolute; height: 170px; }
.mixstage .la { animation: la 1.6s cubic-bezier(.3, 1, .4, 1) both; }
.mixstage .lb { animation: lb 1.6s cubic-bezier(.3, 1, .4, 1) both; }
.mixstage .orb { position: absolute; width: 140px; height: 140px; border-radius: 50%; filter: blur(26px); opacity: 0; animation: orb 1.2s 1s ease-out forwards, breathe 5s 2.2s ease-in-out infinite; z-index: -1; }
.score { font: 200 52px var(--sf); letter-spacing: -.05em; color: var(--accent-deep); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp > div { border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.cmp .bwrap { height: 130px; }
.cmp b { font: 500 15px/1.2 var(--sf); }
.cmp small { color: var(--muted); font-size: 12px; }

/* ---------- Story ---------- */
#story { position: fixed; inset: 0; z-index: 50; color: var(--ink); overflow: hidden; --h: 356; --hA: 8; --hB: 340; --h2: 350; isolation: isolate; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  background: radial-gradient(110% 70% at 50% 26%, hsl(var(--h) 66% 26% / .95), transparent 72%), radial-gradient(90% 55% at 88% 100%, hsl(var(--hA) 60% 20% / .9), transparent 70%), radial-gradient(70% 40% at 0% 90%, hsl(var(--hB) 50% 16% / .8), transparent 70%), #060608; }
#story[hidden] { display: none; }
#story .sb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: -1; animation: drift 14s ease-in-out infinite alternate; }
#story .sb1 { width: 340px; height: 340px; background: hsl(var(--h) 70% 40% / .28); top: -80px; right: -100px; }
#story .sb2 { width: 300px; height: 300px; background: hsl(var(--h2) 60% 32% / .22); bottom: -60px; left: -100px; animation-delay: -5s; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(26px, 22px) scale(1.15); } }
.prog { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; gap: 5px; z-index: 3; }
.prog b { flex: 1; height: 2px; background: rgba(242, 235, 224, .2); overflow: hidden; }
.prog b i { display: block; height: 100%; background: var(--accent-deep); transform-origin: left; transform: scaleX(0); }
.prog b.done i { transform: scaleX(1); }
.prog b.act i { animation: fillp var(--dur, 8s) linear forwards; }
.prog b.act.hold i { transform: scaleX(1); animation: none; }
.paused .prog b.act i { animation-play-state: paused; }
@keyframes fillp { to { transform: scaleX(1); } }
.st-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 26px); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
.st-x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(242, 235, 224, .25); background: rgba(0, 0, 0, .3); color: var(--ink); font-size: 15px; }
#stage { position: absolute; inset: 0; z-index: 1; padding: calc(env(safe-area-inset-top, 0px) + 78px) 26px calc(env(safe-area-inset-bottom, 0px) + 30px); display: flex; flex-direction: column; justify-content: center; gap: 18px; }
#stage h2 { font: 200 clamp(40px, 12vw, 60px)/1 var(--sf); letter-spacing: -.045em; text-wrap: balance; }
#stage .lead { font: 300 clamp(24px, 6.6vw, 32px)/1.22 var(--sf); letter-spacing: -.02em; text-wrap: balance; }
#stage .soft { color: rgba(242, 235, 224, .68); font-size: 15px; letter-spacing: .04em; }
#stage .mono, .st-top .mono { color: var(--accent); }
#stage .chips .chip { background: transparent; border-color: rgba(242, 235, 224, .28); color: var(--ink); cursor: default; }
.rise { animation: srise 1.1s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes srise { from { opacity: 0; transform: translateY(20px); filter: blur(6px); } }
.pop { animation: spop .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes spop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.w { display: inline-block; animation: srise .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 70ms + var(--d, 0) * 1ms); }
.center { text-align: center; align-items: center; }
.hero-bottle { position: relative; height: min(38vh, 320px); display: grid; place-items: center; isolation: isolate; animation: spop 1.3s cubic-bezier(.2, .8, .2, 1) both; }
.hero-bottle .bwrap { height: 100%; }
.hero-bottle .aura { background: hsl(var(--h) 70% 45% / .5); inset: 6% 8%; }
.vibes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vibes span { font: 400 12px var(--sf); letter-spacing: .16em; text-transform: uppercase; padding: 7px 14px; border: 1px solid rgba(242, 235, 224, .3); }
.load-orbit { position: relative; height: 230px; display: grid; place-items: center; }
.load-orbit .bwrap { position: absolute; height: 120px; animation: orbit 7s linear infinite; }
@keyframes orbit { 0% { transform: rotate(0) translateX(84px) rotate(0) scale(.85); opacity: .5; } 50% { opacity: 1; } 100% { transform: rotate(360deg) translateX(84px) rotate(-360deg) scale(.85); opacity: .5; } }
.msgs { position: relative; height: 34px; }
.msgs span { position: absolute; inset: 0; font: 300 22px var(--sf); animation: msg 6.4s infinite; opacity: 0; letter-spacing: -.01em; }
@keyframes msg { 0% { opacity: 0; transform: translateY(10px); } 6%, 26% { opacity: 1; transform: none; } 32%, 100% { opacity: 0; transform: translateY(-10px); } }
.pyr { display: grid; gap: 12px; }
.pyr .lv { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(242, 235, 224, .18); }
.pyr .lv b { font: 300 21px/1.25 var(--sf); letter-spacing: -.01em; }
.meter-s { display: flex; gap: 6px; align-items: center; }
.meter-s i { width: 8px; height: 8px; border-radius: 50%; background: rgba(242, 235, 224, .2); }
.meter-s i.f { background: var(--accent-deep); }
.merge { position: relative; height: 290px; display: grid; place-items: center; }
.merge .bwrap { position: absolute; height: 200px; }
.merge .la { animation: la 1.8s cubic-bezier(.3, 1, .4, 1) both; }
.merge .lb { animation: lb 1.8s cubic-bezier(.3, 1, .4, 1) both; }
@keyframes la { from { transform: translateX(-140%) rotate(-10deg); opacity: 0; } to { transform: translateX(-54%) rotate(3deg); } }
@keyframes lb { from { transform: translateX(140%) rotate(10deg); opacity: 0; } to { transform: translateX(54%) rotate(-3deg); } }
.merge .orb { position: absolute; width: 160px; height: 160px; border-radius: 50%; filter: blur(28px); opacity: 0; animation: orb 1.4s 1.2s ease-out forwards, breathe 5s 2.6s ease-in-out infinite; z-index: -1; }
@keyframes orb { to { opacity: .8; } }
.plus { position: absolute; font: 200 44px var(--sf); opacity: 0; color: var(--accent-deep); animation: orb .6s 1.5s forwards; }
.steps { display: grid; gap: 10px; }
.steps div { display: grid; grid-template-columns: 24px 1fr; gap: 12px; font-size: 15px; color: rgba(242, 235, 224, .85); }
.steps div b { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent-deep); display: grid; place-items: center; font: 500 11px var(--sf); }
.st-btn { border: 0; border-radius: 3px; padding: 16px 22px; font: 600 12.5px var(--sf); letter-spacing: .2em; text-transform: uppercase; background: var(--accent); color: #14100c; }
.st-btn.line { background: transparent; color: var(--ink); border: 1px solid rgba(242, 235, 224, .3); }
.altrow { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border: 1px solid rgba(242, 235, 224, .2); background: rgba(255, 255, 255, .03); text-align: left; color: var(--ink); width: 100%; border-radius: 4px; }
.altrow .bwrap { height: 64px; }
.altrow b { font: 500 17px/1.2 var(--sf); display: block; }
.altrow small { color: rgba(242, 235, 224, .65); }
.petal { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 80% 0 80% 0; animation: fall linear forwards; z-index: 5; pointer-events: none; }
@keyframes fall { to { transform: translate(var(--x), 105vh) rotate(var(--r)); opacity: .9; } }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#story canvas.fx { z-index: 0; opacity: .4; }
#story::after { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(to top, rgba(6, 6, 8, .78) 0%, rgba(6, 6, 8, .5) 36%, transparent 64%); }
#stage .lead, #stage h2, #stage .steps, #stage .pyr { text-shadow: 0 1px 16px rgba(0, 0, 0, .55); }
.pcard canvas.fx, .rec canvas.fx, .vit canvas.fx { z-index: 0; opacity: .34; }
.pcard > *:not(canvas), .rec > *:not(canvas), .vit button > *:not(canvas) { position: relative; z-index: 1; }
.big-bottle canvas.fx { opacity: .5; inset: -30px -20px; width: calc(100% + 40px); height: calc(100% + 60px); z-index: -1; }
.motif { font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: rgba(242, 235, 224, .6); }

/* ---------- Ouverture ---------- */
#splash { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: #080605; color: var(--ink); animation: splashOut .9s 2.4s ease-in forwards; }
#splash .lg { font: 200 clamp(34px, 11vw, 60px)/1 var(--sf); letter-spacing: .34em; text-transform: uppercase; display: flex; margin-right: -.34em; }
#splash .lg span { display: inline-block; animation: srise 1.3s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
#splash .tg { margin-top: 18px; text-align: center; font: 500 11px var(--sf); letter-spacing: .3em; text-transform: uppercase; color: var(--accent); animation: srise 1.2s 1.3s both; }
#splash svg { display: block; margin: 20px auto 0; width: 180px; height: 12px; overflow: visible; }
#splash svg path { stroke-dasharray: 260; stroke-dashoffset: 260; animation: dash 1.8s .7s ease-out forwards; }
@keyframes dash { to { stroke-dashoffset: 0; } }
@keyframes splashOut { to { opacity: 0; visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  .msgs span:first-child { opacity: 1; }
}

/* ---------- Balade, wishlist ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 3px; margin-top: 18px; }
.seg button { border: 0; background: none; padding: 12px 8px; font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: rgba(180, 57, 74, .16); color: var(--accent-deep); }
.wcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); text-align: left; }
.wcard b { display: block; font: 500 16px var(--sf); }
.wcard small { color: var(--muted); font-size: 12.5px; }
.symrow { display: flex; gap: 6px; color: var(--accent-deep); flex-wrap: wrap; justify-content: flex-end; max-width: 55%; }
.symhint { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; }
.sym { display: block; }
.sym.big { color: var(--accent-deep); animation: symdraw 1s ease-out both; }
@keyframes symdraw { from { opacity: 0; transform: scale(.85) rotate(-6deg); } }
.wadd { display: grid; gap: 14px; }
.wentry { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); animation: rise .6s both; }
.wentry:has(.wthumb) { grid-template-columns: 56px 1fr 64px; }
.wsym { display: grid; place-items: center; width: 56px; height: 56px; border: 1px solid var(--line2); border-radius: 3px; color: var(--accent-deep); }
.wbody { display: grid; gap: 4px; min-width: 0; }
.wbody b { font: 500 16px/1.2 var(--sf); }
.wbody small { color: var(--muted); font-size: 12.5px; }
.wbody p { font-size: 14px; color: var(--ink); opacity: .85; }
.wthumb { width: 64px; height: 80px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.symgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.symtile { display: grid; justify-items: center; gap: 4px; padding: 12px 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--accent-deep); }
.symtile small { color: var(--muted); font-size: 10.5px; }
.symtile.on { border-color: var(--wine); background: rgba(180, 57, 74, .14); }
.wl { display: grid; grid-template-columns: 84px 1fr; gap: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); animation: rise .6s both; animation-delay: calc(var(--i) * 70ms); align-items: center; }
.wl .bwrap { height: 120px; }
.wlb { display: grid; gap: 3px; min-width: 0; }
.wlb b { font: 500 17px/1.2 var(--sf); }
.wlb small { color: var(--muted); font-size: 12.5px; }

/* ---------- Scénarios ---------- */
.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: 0 0 auto; border: 0; background: none; padding: 10px 12px 9px; font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.cats button.on { color: var(--accent-deep); border-color: var(--wine); }
.say-wrap > .mono { margin-top: 6px; }

/* ---------- Onboarding ---------- */
#onb { position: fixed; inset: 0; z-index: 70; background: radial-gradient(110% 70% at 50% 28%, hsl(356 60% 22% / .95), transparent 72%), radial-gradient(80% 50% at 90% 100%, hsl(8 55% 16% / .9), transparent 70%), #060608; color: var(--ink); overflow: hidden; display: grid; place-items: center; animation: fade .6s both; }
#onb .sb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: 0; animation: drift 12s ease-in-out infinite alternate; }
#onb .sb1 { width: 320px; height: 320px; background: hsl(356 70% 40% / .3); top: -80px; right: -90px; }
#onb .sb2 { width: 280px; height: 280px; background: hsl(350 60% 34% / .22); bottom: -60px; left: -90px; animation-delay: -4s; }
#onb canvas.fx { z-index: 0; opacity: .38; }
.onb-skip { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; z-index: 3; border: 1px solid rgba(242, 235, 224, .3); background: rgba(0, 0, 0, .3); color: var(--ink); border-radius: 3px; padding: 9px 14px; font: 500 11px var(--sf); letter-spacing: .14em; text-transform: uppercase; }
.onb-s { position: absolute; inset: 0; z-index: 1; padding: 90px 26px 40px; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; }
.onb-s.on { display: flex; }
.onb-s h2 { font: 200 clamp(48px, 15vw, 76px)/1 var(--sf); letter-spacing: -.045em; }
.onb-s .lead { font: 300 clamp(20px, 5.6vw, 26px)/1.3 var(--sf); letter-spacing: -.01em; max-width: 22ch; text-wrap: balance; }
.onb-s .soft { color: rgba(242, 235, 224, .7); letter-spacing: .06em; }
.onb-row { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 210px; }
.onb-row .bwrap { position: relative; }
.onb-type { font: 300 clamp(24px, 7vw, 34px)/1.2 var(--sf); letter-spacing: -.02em; min-height: 2.6em; max-width: 14ch; }
.onb-type .caret { display: inline-block; width: 2px; height: 1em; background: var(--wine); margin-left: 3px; vertical-align: -.12em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.onb-chips { justify-content: center; }
.onb-chips .chip { cursor: default; background: transparent; }
.onb-chips .chip.on { background: rgba(180, 57, 74, .2); }
.onb-hero { position: relative; height: 230px; display: grid; place-items: center; }
.onb-hero .bwrap { height: 100%; }
.onb-lay { display: flex; align-items: center; gap: 12px; border: 1px solid rgba(242, 235, 224, .25); padding: 8px 14px 8px 10px; border-radius: 4px; text-align: left; background: rgba(255, 255, 255, .04); }
.onb-lay b { display: block; font: 500 15px var(--sf); }
.onb-lay small { color: rgba(242, 235, 224, .68); }
.demo-pill { display: inline-block; margin: 8px 0 0; padding: 5px 10px; border: 1px solid rgba(180, 57, 74, .7); color: var(--accent-deep); font: 600 10.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; border-radius: 2px; background: rgba(180, 57, 74, .12); }

.demo-pill { cursor: pointer; }
.card.sell { display: grid; gap: 10px; border-color: rgba(180, 57, 74, .6); background: linear-gradient(160deg, rgba(180, 57, 74, .16), var(--surface) 60%); }
.card.sell h2 { font-size: 22px; line-height: 1.2; }
.card.sell p:not(.mono) { color: var(--muted); font-size: 14px; }

/* ---------- Allègement : plus d'air, moins de bruit ---------- */
.sec { margin-top: 56px; gap: 20px; }
.sec h2 { font-size: 28px; }
.hero { margin-top: 36px; }
.hero .q { margin-bottom: 32px; }
.say-wrap { gap: 26px; }
.say-wrap > .mono, .refine > .mono { margin-bottom: -10px; opacity: .8; }
.chips { gap: 10px; }
.chip { padding: 11px 16px; }
.card { padding: 24px 22px; }
.demo-pill { margin: 12px 0 0; padding: 4px 10px; font-size: 10px; letter-spacing: .12em; background: transparent; border-color: rgba(180, 57, 74, .45); }
.more { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 2px; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: none; color: var(--muted); font: 500 12px var(--sf); letter-spacing: .14em; text-transform: uppercase; text-align: left; }
.more i { font-style: normal; font-size: 20px; line-height: 1; color: var(--accent-deep); }
.refine { display: grid; gap: 26px; animation: rise .5s both; }
.shelf { gap: 18px; }
.pcard { padding: 22px 14px 18px; }
.wl { padding: 18px; gap: 18px; }
.rec .buy a:nth-child(2) { display: none; }
.rec { padding: 26px 22px 22px; }
.rec ul { line-height: 1.6; }
.card.sell { padding: 28px 24px; gap: 14px; }
.wl .buy a:nth-child(2) { display: none; }
.wl .bwrap { height: 104px; }
.wl { grid-template-columns: 72px 1fr; }
/* Ambiances derrière les flacons : beaucoup plus transparentes, le flacon reste le sujet */
.pcard canvas.fx, .rec canvas.fx, .vit canvas.fx { opacity: .14; }
#story canvas.fx { opacity: .2; }
.big-bottle canvas.fx { opacity: .2; }
#onb canvas.fx { opacity: .18; }

/* ---------- Profil : genre et tenue ---------- */
#prof { position: fixed; inset: 0; z-index: 75; background: radial-gradient(110% 60% at 50% 0%, hsl(356 60% 20% / .9), transparent 70%), #08080a; color: var(--ink); overflow-y: auto; animation: fade .5s both; }
.prof-in { max-width: 440px; margin: 0 auto; min-height: 100%; padding: 72px 22px 40px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.prof-in h2 { font: 200 36px/1.1 var(--sf); letter-spacing: -.03em; margin: 0; }
.prof-in .soft { color: var(--muted); margin: 0; font-size: 15px; }
.gen { display: grid; gap: 10px; }
.gen .chip { padding: 17px 18px; font-size: 16px; }
.dress { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: grid; gap: 4px; justify-items: start; text-align: left; padding: 16px 14px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); transition: border-color .25s, background .25s; }
.tile svg { color: var(--accent-deep); margin-bottom: 6px; }
.tile b { font: 500 15px var(--sf); }
.tile small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.tile.on { border-color: var(--wine); background: rgba(180, 57, 74, .16); }

/* ---------- Tenue, stock ---------- */
.agein { font-size: 28px; font-weight: 200; text-align: center; letter-spacing: .04em; }
.dresses { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; scroll-snap-type: x proximity; }
.dresses::-webkit-scrollbar { display: none; }
.dchip { flex: 0 0 auto; display: grid; justify-items: center; gap: 6px; width: 88px; padding: 12px 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--muted); scroll-snap-align: start; transition: border-color .25s, background .25s, color .25s; }
.dchip span { font: 500 11px/1.2 var(--sf); text-align: center; }
.dchip.on { border-color: var(--wine); background: rgba(180, 57, 74, .16); color: var(--accent-deep); }
.prew { display: grid; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.stk-ed { display: grid; gap: 8px; }
.stk-ed .chip { padding: 8px 11px; font-size: 12.5px; }
.stk-b { position: absolute; top: 10px; right: 10px; z-index: 2; font: 600 8.5px var(--sf); letter-spacing: .14em; text-transform: uppercase; font-style: normal; padding: 3px 6px; border: 1px solid rgba(180, 57, 74, .6); color: var(--accent-deep); border-radius: 2px; background: rgba(8, 8, 10, .55); }
.stk-b.low { border-color: rgba(214, 186, 140, .5); }

.emptycard { display: grid; gap: 14px; margin-bottom: 8px; border-color: rgba(180, 57, 74, .5); }
.emptycard h2 { font: 300 24px/1.15 var(--sf); margin: 0; }
.emptycard p:not(.mono) { color: var(--muted); font-size: 15px; margin: 0; }


/* ---------- Explorer la base ---------- */
#sheet .panel:has(.exp) { min-height: 86vh; }
.exp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; }
.exp > * { min-width: 0; }
.exp input[type=search] { width: 100%; }
.xtabs { gap: 6px; }
.xtabs .chip { padding: 8px 12px; font-size: 13px; }
.xg { max-height: 52vh; overflow: auto; }
.xgrid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.xc { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 8px 12px 8px 8px; border: 1px solid var(--line); border-radius: 4px; background: transparent; transition: border-color .25s, background .25s; }
.xc:hover { border-color: var(--line2); }
.xc.on { background: rgba(180, 57, 74, .16); border-color: var(--wine); }
.xc[disabled] { opacity: .5; cursor: default; }
.xth { width: 48px; height: 64px; object-fit: contain; display: grid; place-items: center; }
.xth.ph { border-radius: 3px; background: var(--accent-soft); color: var(--muted); font: 200 22px var(--sf); }
.xt { display: grid; gap: 2px; min-width: 0; }
.xt b { font-weight: 500; font-size: 15px; }
.xt small { color: var(--muted); font-size: 12.5px; }
.xt em { font-style: normal; color: var(--muted); font-size: 12.5px; line-height: 1.35; opacity: .9; }
.xm { font-style: normal; font-size: 12px; color: var(--muted); white-space: nowrap; }
.xc.on .xm { color: var(--accent-deep); }
.xpop { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.xp { flex: 0 0 104px; scroll-snap-align: start; display: grid; gap: 4px; justify-items: center; text-align: center; padding: 8px 6px; border: 1px solid var(--line); border-radius: 4px; background: transparent; }
.xp .xth { height: 78px; width: 100%; }
.xp b { font-weight: 500; font-size: 12.5px; line-height: 1.2; }
.xp small { color: var(--muted); font-size: 11px; }
.xp.on { background: rgba(180, 57, 74, .16); border-color: var(--wine); }
.xp[disabled] { opacity: .45; }
.xback { align-items: center; gap: 10px; }
.exp-foot { position: sticky; bottom: -1px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 4px; margin-top: 6px; background: linear-gradient(transparent, #100d0c 28%); }
#prof .exp-foot { background: linear-gradient(transparent, #0a0809 28%); }
#prof .prof-in.wide { max-width: 620px; justify-content: flex-start; padding-top: 28px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; padding: 6px 0; text-align: left; }

/* ---------- Wishlist, lexique, descriptions ---------- */
.wtabs { margin-bottom: 12px; }
.wname { margin-top: 12px; }
.wname summary { cursor: pointer; padding: 8px 0; }
.wd, .rd { display: block; font-style: normal; color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-top: 4px; }
.card.lex { display: grid; gap: 8px; }
.card.lex h3 { font: 300 22px/1.2 var(--sf); letter-spacing: -.02em; }
.card.lex p:not(.mono) { color: var(--muted); font-size: 14.5px; }
#whens .chip, #venues .chip { padding: 8px 12px; font-size: 13px; }
.exp-foot .cta { padding: 12px 16px; font-size: 11.5px; letter-spacing: .14em; }
.xth svg, .xth canvas { max-height: 64px; width: auto; }

.dock button { letter-spacing: .04em; font-size: 8.5px; }
.xtg { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.xtg i { font-style: normal; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 1px 6px; }
#sq { width: 100%; margin-bottom: 10px; }
.filters { margin: 8px 0 14px; }
.filters summary { cursor: pointer; padding: 8px 0; }
.filters .mono { margin-top: 12px; }
.filters .chip { padding: 7px 11px; font-size: 12.5px; }

.acct-tabs { gap: 10px; }

.hero { margin-top: 44px; }

.chip { padding: 11px 16px; }

.hub .soft { font-size: 15px; }

.opt span { color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.exp { gap: 30px; }
.exp h2 { margin-bottom: 4px; }
.exp input[type=search] { padding: 16px 18px; }
#xbody { display: grid; gap: 24px; }
.xtabs { gap: 10px; }
.xg { gap: 12px; padding: 2px 2px 6px; }
.xgrid { gap: 14px; }
.xc { grid-template-columns: 56px 1fr auto; gap: 16px; padding: 16px 18px 16px 12px; border-radius: 6px; }
.xth { width: 56px; height: 76px; }
.xt { gap: 6px; }
.xt b { font-size: 16px; }
.xt em { margin-top: 2px; line-height: 1.45; }
.xpop { gap: 14px; padding-bottom: 10px; }
.xp { flex-basis: 118px; padding: 16px 10px; gap: 8px; border-radius: 6px; }

.xback { margin-bottom: 4px; }
.exp-foot { padding: 20px 0 6px; margin-top: 12px; }

    neutre: { polyvalent: 0.5, élégant: 0.5, discret: 0.3 },
    clair: { frais: 0.8, léger: 0.8, propre: 0.5, floral: 0.3 },
    colore: { joyeux: 0.8, fruité: 0.6, énergique: 0.5 },
  };
  const FABRIC = {
    coton: { propre: 0.5, frais: 0.3 },
    lin: { frais: 1, naturel: 1, léger: 0.5 },
    laine: { chaud: 0.8, confortable: 0.8, ambré: 0.5, boisé: 0.4 },
    cuir: { cuir: 2, boisé: 0.8, épicé: 0.5, mystérieux: 0.5 },
    denim: { polyvalent: 0.5, naturel: 0.5, boisé: 0.4 },
    soie: { élégant: 1, floral: 0.8, musqué: 0.6, doux: 0.5 },
    technique: { sportif: 1, frais: 0.8, aquatique: 0.6 },
  };

  const NOTE_TAGS = {
    gourmand: ['vanille', 'tonka', 'caramel', 'praliné', 'miel', 'cacao', 'café', 'datte', 'châtaigne', 'marron'],
    frais: ['citron', 'bergamote', 'pamplemousse', 'mandarine', 'orange', 'marin', 'menthe', 'sel', 'linge propre'],
    doux: ['iris', 'benjoin'],
  };

  function perfumeTags(p) {
    if (p._tags) return p._tags;
    const t = new Set(FAMILIES[p.family] ? FAMILIES[p.family].tags : []);
    if (p.family) t.add(p.family);
    const w = p.weight || 3;
    if (w <= 1) { t.add('frais'); t.add('léger'); }
    else if (w === 2) t.add('léger');
    else if (w === 3) t.add('polyvalent');
    else if (w === 4) t.add('chaud');
    else { t.add('dense'); t.add('chaud'); }
    if (w >= 4) { t.delete('léger'); t.delete('frais'); }
    if (w <= 2) { t.delete('dense'); }
    if ((p.projection || 3) >= 4) t.add('statement');
    if ((p.projection || 3) <= 2) t.add('discret');
    const notes = (p.notes || []).map(norm);
    for (const [tag, list] of Object.entries(NOTE_TAGS)) {
      if (notes.some((n) => list.some((k) => n.includes(norm(k))))) t.add(tag);
    }
    Object.defineProperty(p, '_tags', { value: [...t], enumerable: false, configurable: true });
    return p._tags;
  }

  // ---------- Météo ----------
  function weatherWant(w) {
    const t = w.temp == null ? 18 : w.temp;
    const heat = clamp((t - 16) / 8, -2, 2);
    const m = { frais: heat * 1.2, léger: heat, chaud: -heat * 1.2, dense: -heat * 1.2, polyvalent: (1 - Math.min(1, Math.abs(heat))) * 0.6 };
    if (w.rain) { m.naturel = 0.5; m.confortable = 0.5; m.sportif = -0.5; }
    if ((w.hum || 0) > 75 && t > 22) m.dense -= 1;
    if ((w.hum || 0) > 75) { m.propre = (m.propre || 0) + .3; m.dense -= .5; }
    return m;
  }
  function weatherLabel(w) {
    const t = w.temp;
    if (t == null) return '';
    if (t >= 28) return 'grosse chaleur : frais et léger';
    if (t >= 21) return 'douceur : plutôt léger';
    if (t >= 13) return 'tempéré : tout passe';
    if (t >= 6) return 'frais : place aux notes chaudes';
    return 'froid : dense et enveloppant';
  }

  // ---------- Scoring du jour ----------
  function projPenalty(range, proj) {
    if (!range) return 0;
    const [lo, hi] = range;
    const d = proj < lo ? lo - proj : proj > hi ? proj - hi : 0;
    return -1.2 * d;
  }

  // Stock : taille du flacon, ce qu'il en reste, et l'usage voulu (au quotidien, grandes occasions, peu importe).
  const STOCK_USES = { daily: 'Au quotidien', special: 'Grandes occasions', free: 'Peu importe' };
  const STOCK_LEFT = { 100: 'Plein', 75: 'Beaucoup', 50: 'La moitié', 25: 'Il en reste peu', 10: 'Presque fini' };
  function stockOf(p) {
    const size = +p.size > 0 ? +p.size : 100, left = p.left == null ? 100 : Math.max(0, Math.min(100, +p.left));
    return { size, left, ml: Math.round(size * left) / 100, use: STOCK_USES[p.use] ? p.use : 'free' };
  }
  const isBig = (cond) => cond.ctx === 'event' || cond.ctx === 'date';
  // Un échantillon ou un flacon presque fini ne part pas en usage quotidien ; un parfum « grandes occasions » attend son moment.
  function stockEffect(p, cond) {
    const k = stockOf(p), big = isBig(cond); let v = 0;
    if (k.use === 'special') v += big ? 1 : -3.5;
    if (k.ml <= 4) v += big ? (k.use === 'special' ? 0 : -0.5) : -3; else if (k.ml <= 10) v += big ? 0 : -1.5;
    if (k.use === 'daily' && k.ml >= 30) v += 0.5;
    return v;
  }
  function score(p, cond, st) {
    st = st || {};
    const tags = perfumeTags(p);
    const k = 6 / Math.max(tags.length, 4);
    const sum = (map) => tags.reduce((a, t) => a + (map[t] || 0), 0) * k;
    const proj = p.projection || 3;
    const parts = { weather: 0, ctx: 0, mood: 0, outfit: 0, perso: 0 };
    parts.weather = 1.5 * sum(weatherWant(cond));
    parts.ctx = sum((CTX[cond.ctx] || {}).w || {}) + sum((WITH[cond.with] || {}).w || {}) + sum(MOMENT[cond.moment] || {})
      + 0.8 * (projPenalty((CTX[cond.ctx] || {}).proj, proj) + projPenalty((WITH[cond.with] || {}).proj, proj));
    if ((p.occ || []).includes(cond.ctx)) parts.ctx += 2;
    parts.mood = 1.5 * sum(MOOD[cond.mood] || {});
    const pl = PLACE[cond.place];
    if (pl) parts.ctx += sum(pl.w) + 0.8 * projPenalty(pl.proj, proj);
    const vn = VENUE[cond.venue];
    if (vn) parts.ctx += sum(vn.w) + 0.8 * projPenalty(vn.proj, proj);
    // Moment idéal connu (jour / soir / nuit) pour les parfums du catalogue
    const mo = p.m || (root.DESC && root.DESC[p.name] && root.DESC[p.name][0]);
    if (mo && mo !== 'tous' && cond.moment) {
      const M = { jour: { jour: 1.2, soir: -.4, nuit: -1.6 }, soir: { jour: -.8, soir: 1.2, nuit: .8 }, nuit: { jour: -1.8, soir: .6, nuit: 1.4 } };
      parts.ctx += (M[mo] || {})[cond.moment] || 0;
    }
    // Notes que la personne adore ou fuit
    const nt = (p.notes || []).map(norm);
    // Pas de parfum nettement « pour elle » à un homme, ni l'inverse (les mixtes passent)
    const gd = st.gender && root.genderOf ? root.genderOf(p.name, p.house) : 'u';
    parts.gender = (st.gender === 'm' && gd === 'f') || (st.gender === 'f' && gd === 'm') ? -3 : 0;
    parts.liked = 0;
    if (st.liked && st.liked.length) parts.liked += Math.min(2, st.liked.filter((l) => l && nt.some((n) => n.includes(norm(l)))).length) * 0.9;
    if (st.avoid && st.avoid.length) parts.liked -= Math.min(3, st.avoid.filter((a) => a && nt.some((n) => n.includes(norm(a)))).length * 1.5);
    if (cond.dur === 'longue') parts.ctx += 0.8 * ((p.longevity || 3) - 3) + ((p.weight || 3) === 3 ? .3 : 0);
    parts.outfit = 0.8 * (sum(STYLE[cond.style] || {}) + sum(COLOR[cond.color] || {}) + sum(FABRIC[cond.fabric] || {}));
    parts.perso = ((p.rating || 3) - 3) * 0.8;
    const days = st.daysSince ? st.daysSince(p.id) : null;
    if (days != null) parts.perso += days === 0 ? -3 : days === 1 ? -1.5 : days === 2 ? -0.7 : days >= 14 ? 0.5 : 0;
    if (st.daysSince) parts.stock = stockEffect(p, cond); // pas dans le calcul des manques de collection
    const total = Object.values(parts).reduce((a, b) => a + b, 0);
    return { total, parts };
  }

  function reasons(p, cond, parts) {
    const r = [];
    if (parts.weather >= 1) r.push(`Météo : ${weatherLabel(cond)}`);
    if (parts.ctx >= 1.5) r.push(`Colle à ta journée (${CONTEXTS[cond.ctx].toLowerCase()} · ${WITHS[cond.with].toLowerCase()})`);
    if (parts.mood >= 1) r.push(`Épouse ton mood (${MOODS[cond.mood].toLowerCase()})`);
    if (cond.place && parts.ctx >= 1) r.push(`Adapté au lieu (${PLACES[cond.place].toLowerCase()})`);
    if (cond.venue && VENUES[cond.venue] && parts.ctx >= 1) r.push(`Fait pour ${VENUES[cond.venue].toLowerCase()}`);
    const mo = p.m || (root.DESC && root.DESC[p.name] && root.DESC[p.name][0]);
    if (mo && mo !== 'tous' && mo === cond.moment) r.push(cond.moment === 'jour' ? 'Un parfum de journée' : cond.moment === 'soir' ? 'Un parfum de soirée' : 'Un parfum de nuit');
    if (parts.liked >= 0.9) r.push('Des notes que tu adores');
    if (parts.liked <= -1.4) r.push('⚠ Contient une note que tu fuis');
    if (cond.dur === 'longue' && (p.longevity || 3) >= 4) r.push('Tient toute la journée');
    if (parts.outfit >= 1) r.push(`Va avec ta tenue (${STYLES[cond.style].toLowerCase()}${cond.fabric ? ', ' + FABRICS[cond.fabric].toLowerCase() : ''})`);
    if ((p.rating || 3) >= 4) r.push('Un de tes chouchous');
    if (parts.perso >= 0.4 && (p.rating || 3) < 4) r.push('Pas porté depuis un moment');
    if (parts.perso <= -1.4) r.push('⚠ Déjà porté très récemment');
    if (parts.stock >= 1) r.push('Gardé pour les grandes occasions : c\'est le moment');
    if (parts.stock <= -1.4) r.push(stockOf(p).use === 'special' && stockOf(p).ml > 10 ? '⚠ Réservé aux grandes occasions' : '⚠ Stock limité : à ménager');
    return r;
  }

  function rank(collection, cond, st) {
    return collection
      .map((p) => { const s = score(p, cond, st); return { p, total: s.total, parts: s.parts, reasons: reasons(p, cond, s.parts) }; })
      .sort((a, b) => b.total - a.total);
  }

  // ---------- Layering ----------
  const PAIR = {
    'agrumes|boisé': 2.5, 'agrumes|ambré': 2, 'agrumes|musqué': 2, 'agrumes|cuir': 2, 'agrumes|vert': 1.5, 'agrumes|épicé': 1.5, 'agrumes|gourmand': 1, 'agrumes|floral': 1.5, 'agrumes|oud': 1.5,
    'aquatique|boisé': 2, 'aquatique|musqué': 2, 'aquatique|aromatique': 1.5, 'aquatique|agrumes': 1, 'aquatique|vert': 1.5, 'aquatique|gourmand': -1.5, 'aquatique|oud': -1.5, 'aquatique|ambré': -0.5,
    'aromatique|boisé': 2.5, 'aromatique|ambré': 2, 'aromatique|cuir': 2, 'aromatique|épicé': 1.5, 'aromatique|gourmand': 1.5, 'aromatique|musqué': 1.5,
    'vert|boisé': 2, 'vert|musqué': 1.5, 'vert|floral': 1.5,
    'floral|boisé': 2, 'floral|musqué': 2.5, 'floral|ambré': 2, 'floral|gourmand': 1.5, 'floral|oud': 2.5, 'floral|fruité': 1.5, 'floral|cuir': 1.5,
    'fruité|musqué': 2, 'fruité|boisé': 1.5, 'fruité|gourmand': 1.5,
    'gourmand|boisé': 2.5, 'gourmand|musqué': 2, 'gourmand|ambré': 1.5, 'gourmand|épicé': 2, 'gourmand|cuir': 2, 'gourmand|oud': 1,
    'ambré|boisé': 2.5, 'ambré|musqué': 2, 'ambré|épicé': 1.5, 'ambré|cuir': 2, 'ambré|oud': 1,
    'boisé|musqué': 2, 'boisé|épicé': 2, 'boisé|cuir': 2.5, 'boisé|oud': 2,
    'épicé|cuir': 2, 'épicé|musqué': 1.5, 'cuir|oud': 1.5, 'cuir|musqué': 1.5, 'oud|musqué': 1.5,
  };
  const EFFECT = {
    agrumes: 'un coup de fraîcheur pétillante', aquatique: 'de la transparence et de l\'air', aromatique: 'une fraîcheur naturelle, herbacée',
    vert: 'une touche verte et végétale', floral: 'de la rondeur florale', fruité: 'un côté juteux et joyeux', gourmand: 'de la douceur et du confort',
    ambré: 'de la chaleur et du sillage', boisé: 'de la profondeur et de l\'élégance', épicé: 'du relief et du caractère', cuir: 'une pointe de caractère et de mystère',
    musqué: 'un effet « seconde peau », doux et propre', oud: 'du mystère et de la densité',
  };

  function pairScore(a, b, heat) {
    const key = [a.family, b.family].sort().join('|');
    let s = a.family === b.family ? 0.3 : (PAIR[key] != null ? PAIR[key] : 0.5);
    const na = (a.notes || []).map(norm), nb = new Set((b.notes || []).map(norm));
    const shared = na.filter((n) => nb.has(n)).length;
    s += Math.min(2, shared) * 0.8;
    if (Math.abs((a.weight || 3) - (b.weight || 3)) >= 2) s += 0.7;
    if (heat && (a.weight || 3) >= 4 && (b.weight || 3) >= 4) s -= 1.5;
    if ((a.projection || 3) >= 4 && (b.projection || 3) >= 4) s -= 0.5;
    return { s, shared: na.filter((n) => nb.has(n)) };
  }

  function outfitTip(cond) {
    if (cond.fabric === 'laine') return 'Sur la maille, un spray tient très longtemps : vaporise-le sur le pull, l\'autre sur la peau.';
    if (cond.fabric === 'cuir') return 'Évite de vaporiser directement sur le cuir : peau uniquement (poignets, cou).';
    if (cond.fabric === 'soie') return 'Pas de spray sur la soie ou le satin (risque de taches) : peau seulement.';
    if (cond.fabric === 'lin') return 'Le lin boit le parfum : reste léger, 1 spray de chaque suffit.';
    if ((cond.temp || 18) >= 27) return 'Chaleur : 1 spray de chaque, pas plus, sinon ça sature vite.';
    return null;
  }

  function layering(main, collection, cond, st, n) {
    const heat = (cond.temp == null ? 18 : cond.temp) >= 26;
    const opts = collection.filter((b) => b.id !== main.id).map((b) => {
      const ps = pairScore(main, b, heat);
      const ctxScore = score(b, cond, st).total;
      return { b, ps, total: ps.s + 0.25 * ctxScore };
    }).sort((x, y) => y.total - x.total).slice(0, n || 3);
    return opts.map(({ b, ps, total }) => {
      const mainBase = (main.weight || 3) >= (b.weight || 3);
      const base = mainBase ? main : b, top = mainBase ? b : main;
      const lvl = total >= 3.5 ? 'Accord très réussi' : total >= 2 ? 'Bon accord' : 'Accord original';
      const what = `${b.name} apporte ${EFFECT[b.family] || 'une autre facette'} à ${main.name}.`;
      const bridge = ps.shared.length ? ` Pont olfactif : ${ps.shared.join(', ')}.` : '';
      const ratio = heat ? '1 spray + 1 spray' : ((main.projection || 3) >= 4 || (b.projection || 3) >= 4) ? '2 sprays du plus léger + 1 du plus puissant' : '2 sprays + 1 spray';
      return {
        b, total, level: lvl, what: what + bridge,
        how: `Applique d'abord ${base.name} (base), puis ${top.name} par-dessus, au même endroit. Dosage : ${ratio}.`,
        tip: outfitTip(cond),
      };
    });
  }

  // ---------- Profil de goûts / achats ----------
  function tasteProfile(collection, settings) {
    const fam = {}, note = {};
    for (const p of collection) {
      const w = (p.rating || 3) - 2.5;
      if (p.family) fam[p.family] = (fam[p.family] || 0) + w;
      for (const n of p.notes || []) note[norm(n)] = (note[norm(n)] || 0) + w;
    }
    for (const n of settings.liked || []) note[norm(n)] = (note[norm(n)] || 0) + 2;
    for (const n of settings.avoid || []) note[norm(n)] = (note[norm(n)] || 0) - 3;
    const mx = (o) => Math.max(1, ...Object.values(o).map(Math.abs));
    const mf = mx(fam), mn = mx(note);
    for (const k in fam) fam[k] /= mf;
    for (const k in note) note[k] /= mn;
    return { fam, note };
  }

  function taste(c, prof) {
    let s = 4 * (prof.fam[c.family] || 0);
    const hits = [];
    for (const n of c.notes || []) {
      const v = prof.note[norm(n)] || 0;
      s += 1.2 * v;
      if (v > 0.25) hits.push(n);
    }
    return { s: clamp(s, -4, 7), hits: hits.slice(0, 3) };
  }

  const SCENARIOS = [
    { id: 's1', label: 'journée pro en été', c: { temp: 28, ctx: 'pro', with: 'collegues', moment: 'jour', mood: 'confiant', style: 'smart', color: 'clair', fabric: 'coton' } },
    { id: 's2', label: 'soirée date en hiver', c: { temp: 4, ctx: 'date', with: 'partenaire', moment: 'soir', mood: 'romantique', style: 'soiree', color: 'sombre', fabric: 'laine' } },
    { id: 's3', label: 'événement / soirée statement', c: { temp: 15, ctx: 'event', with: 'inconnus', moment: 'soir', mood: 'confiant', style: 'soiree', color: 'sombre', fabric: 'soie' } },
    { id: 's4', label: 'sortie entre amis à la mi-saison', c: { temp: 16, ctx: 'amis', with: 'amis', moment: 'jour', mood: 'joyeux', style: 'casual', color: 'colore', fabric: 'denim' } },
    { id: 's5', label: 'bureau en hiver', c: { temp: 5, ctx: 'pro', with: 'collegues', moment: 'jour', mood: 'calme', style: 'costume', color: 'neutre', fabric: 'laine' } },
    { id: 's6', label: 'sport / grosse chaleur', c: { temp: 31, ctx: 'perso', with: 'seul', moment: 'jour', mood: 'energique', style: 'sport', color: 'clair', fabric: 'technique' } },
    { id: 's7', label: 'date d\'été', c: { temp: 26, ctx: 'date', with: 'premier', moment: 'soir', mood: 'romantique', style: 'smart', color: 'clair', fabric: 'lin' } },
    { id: 's8', label: 'moment famille cocooning', c: { temp: 11, ctx: 'famille', with: 'famille', moment: 'jour', mood: 'fatigue', style: 'casual', color: 'neutre', fabric: 'laine' } },
  ];

  function coverage(collection) {
    return SCENARIOS.map((sc) => {
      let best = -Infinity, bestP = null;
      for (const p of collection) { const s = score(p, sc.c).total; if (s > best) { best = s; bestP = p; } }
      return { sc, best: bestP ? best : -3, bestP };
    });
  }

  function recommend(catalog, collection, wishlist, settings) {
    const prof = tasteProfile(collection, settings);
    const cov = coverage(collection);
    const owned = new Set(collection.map((p) => norm(p.name)));
    const avoid = (settings.avoid || []).map(norm);
    const budget = settings.budget || 0;
    const out = [];
    for (const c of catalog) {
      if (owned.has(norm(c.name))) continue;
      if (settings.gender && root.genderOf) { const g = root.genderOf(c.name, c.house); if ((settings.gender === 'm' && g === 'f') || (settings.gender === 'f' && g === 'm')) continue; }
      if ((c.notes || []).some((n) => avoid.some((a) => a && norm(n).includes(a)))) continue;
      const t = taste(c, prof);
      let gap = 0, gapLabel = null, gapMax = 0;
      for (const { sc, best } of cov) {
        const d = Math.max(0, score(c, sc.c).total - best);
        gap += d / cov.length;
        if (d > gapMax) { gapMax = d; gapLabel = sc.label; }
      }
      const mates = collection.filter((p) => pairScore(c, p, false).s >= 2.5);
      const total = t.s + 1.2 * gap + Math.min(3, mates.length) * 0.4;
      out.push({
        c, taste: t.s, hits: t.hits, gap, gapLabel: gapMax >= 1.5 ? gapLabel : null, mates: mates.slice(0, 3),
        total, pct: clamp(Math.round(50 + t.s * 7), 5, 99), overBudget: budget > 0 && c.price > budget,
        wished: wishlist.some((w) => norm(w) === norm(c.name)),
      });
    }
    return out;
  }

  const api = { VENUES, STOCK_USES, STOCK_LEFT, stockOf, stockEffect, norm, FAMILIES, CONTEXTS, WITHS, MOMENTS, MOODS, PLACES, DURS, STYLES, COLORS, FABRICS, SCENARIOS, perfumeTags, score, rank, layering, pairScore, tasteProfile, coverage, recommend, weatherLabel };
  if (typeof module !== 'undefined') module.exports = api;
  else root.Engine = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// Flacons SVG animés. Chaque maison a sa silhouette (bouchon, étiquette, verre) dessinée à la main,
// la couleur du jus vient de la famille olfactive. Aucun vert : les teintes vertes sont déportées.
(function (root) {
  const BASE = { agrumes: 40, aquatique: 204, aromatique: 214, vert: 198, floral: 8, fruité: 356, gourmand: 20, ambré: 34, boisé: 26, épicé: 4, cuir: 12, musqué: 28, oud: 350 };
  const SAT = { musqué: 60, cuir: 48, boisé: 44, oud: 42, ambré: 80, gourmand: 66, épicé: 82 };
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
  const noGreen = (h) => { h = ((h % 360) + 360) % 360; return h > 44 && h < 178 ? (h < 111 ? 38 : 190) : h; };
  let n = 0;

  function pal(p) {
    const f = p.family;
    const h = noGreen((BASE[f] != null ? BASE[f] : 300) + (hash(p.name) % 44) - 22);
    const s = Math.round((SAT[f] != null ? SAT[f] : 72) * 0.85);
    return { h, s, a: `hsl(${h} ${s}% 78%)`, b: `hsl(${h} ${Math.min(92, s + 6)}% 60%)`, c: `hsl(${h} ${Math.min(92, s + 8)}% 34%)`, d: `hsl(${h} ${Math.max(18, s - 22)}% 13%)` };
  }
  const famColor = (f) => `hsl(${noGreen(BASE[f] != null ? BASE[f] : 300)} ${SAT[f] != null ? SAT[f] : 72}% 62%)`;

  // Corps de flacon (viewBox 120 x 200) : chemin, col, capuchon [x,y,l,h,r], haut/bas du liquide, largeur utile
  const SHAPES = [
    { body: 'M30 78a8 8 0 0 1 8-8h44a8 8 0 0 1 8 8v94a8 8 0 0 1-8 8H38a8 8 0 0 1-8-8z', neck: [50, 54, 20, 18], cap: [44, 32, 32, 24, 4], top: 70, bottom: 180, x: [30, 90], nz: [60, 32] },
    { body: 'M16 125a44 52 0 1 0 88 0a44 52 0 1 0-88 0z', neck: [50, 58, 20, 22], cap: [46, 36, 28, 24, 8], top: 73, bottom: 177, x: [16, 104], nz: [60, 36] },

  // Maison -> silhouette réelle (forme, bouchon, étiquette, verre teinté)
  function arche(p) {

    if (/margiela/.test(H)) return { shape: 0, cap: 'black', label: 'type' };

    if (/nasomatto/.test(H)) return { shape: 4, cap: 'silver', label: 'gold', dark: true };

    if (/chanel|dior|hermes|guerlain|lancome|saint laurent|armani|givenchy|prada/.test(H)) return { shape: hash(N) % 2 ? 5 : 2, cap: /dior|chanel|saint laurent/.test(H) ? 'black' : 'silver', label: 'plain' };

  }

  const CAPS = { black: ['#4a4a52', '#141418', '#050507'], gold: ['#fbeab0', '#c99a35', '#7c5714'], silver: ['#ffffff', '#b4b8c2', '#6c7079'], wood: ['#b98650', '#7a4d26', '#3d240f'] };

  function capDefs(id, type, P) {

    if (kind === 'lab') return `<rect x="${cx - w / 2}" y="${midY - 20}" width="${w}" height="40" rx="1.5" fill="#fbfbf8"/><text x="${cx}" y="${midY - 8}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="${fit(name, w - 4, 7)}" fill="#141418">${esc(name)}</text><text x="${cx}" y="${midY + 2}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3.4" letter-spacing=".4" fill="#141418">EAU DE PARFUM</text><line x1="${cx - w / 2 + 4}" x2="${cx + w / 2 - 4}" y1="${midY + 8}" y2="${midY + 8}" stroke="#141418" stroke-width=".4"/><text x="${cx}" y="${midY + 16}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="${fit(house, w - 4, 5)}" letter-spacing=".8" fill="#141418">${esc(house)}</text>`;
    if (kind === 'oval') return `<ellipse cx="${cx}" cy="${midY}" rx="${w / 2 + 3}" ry="17" fill="#fbfbf8" stroke="#141418" stroke-width="1"/><ellipse cx="${cx}" cy="${midY}" rx="${w / 2 - 1}" ry="14" fill="none" stroke="#141418" stroke-width=".4"/><text x="${cx}" y="${midY - 2}" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="6.4" fill="#141418">${esc(String(p.house).toLowerCase())}</text><text x="${cx}" y="${midY + 7}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="${fit(name, w, 4.4)}" letter-spacing=".5" fill="#141418">${esc(name)}</text>`;

    if (kind === 'type') return `<rect x="${cx - w / 2}" y="${midY - 18}" width="${w}" height="36" fill="#efe6d2" stroke="#141418" stroke-width=".6"/><text x="${cx}" y="${midY - 8}" text-anchor="middle" font-family="Courier New, monospace" font-size="3.6" fill="#141418">REPLICA</text><text x="${cx}" y="${midY + 2}" text-anchor="middle" font-family="Courier New, monospace" font-weight="700" font-size="${fit(name, w - 4, 5.4)}" fill="#141418">${esc(name)}</text><text x="${cx}" y="${midY + 12}" text-anchor="middle" font-family="Courier New, monospace" font-size="3.2" fill="#141418">EAU DE TOILETTE</text>`;
    if (kind === 'frost') return `<rect x="${cx - w / 2}" y="${midY - 18}" width="${w}" height="36" fill="rgba(255,255,255,.72)"/><text x="${cx}" y="${midY - 6}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="${fit(house, w - 4, 6)}" letter-spacing="1.2" fill="#141418">${esc(house)}</text><text x="${cx}" y="${midY + 6}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="${fit(name, w - 4, 4.2)}" letter-spacing=".4" fill="#141418">${esc(name)}</text>`;
    if (kind === 'gold') return `<rect x="${cx - w / 2}" y="${midY - 14}" width="${w}" height="28" fill="none" stroke="#e9e2d6" stroke-width=".8"/><text x="${cx}" y="${midY - 2}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="${fit(name, w - 4, 5.6)}" letter-spacing=".8" fill="#e9e2d6">${esc(name)}</text><text x="${cx}" y="${midY + 8}" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="3.2" fill="#e9e2d6">${esc(house)}</text>`;
    if (kind === 'mini') return `<rect x="${cx - 10}" y="${midY - 16}" width="20" height="32" fill="rgba(255,255,255,.85)"/><text transform="translate(${cx + 2.4} ${midY + 13}) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="${fit(name, 26, 5)}" letter-spacing=".6" fill="#141418">${esc(name)}</text>`;
    const ini = String(p.house || p.name).split(/[\s&]+/).filter(Boolean).map((x) => x[0]).join('').slice(0, 3).toUpperCase();
    return `<rect x="${cx - 18}" y="${midY - 13}" width="36" height="26" rx="3" fill="rgba(255,255,255,.9)"/><text x="${cx}" y="${midY + 4}" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="500" fill="${ink}">${ini}</text>`;
  }
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function bottle(p, o) {
    o = o || {};
    const P = pal(p), A = arche(p), sh = SHAPES[A.shape], id = 'bt' + (++n);

      }
    }
    const bub = [0, 1, 2].map((i) => `<circle class="lbub" cx="${sh.x[0] + 12 + i * 15}" cy="${sh.bottom - 8}" r="${1.2 + i * 0.5}" fill="#fff" style="animation-delay:${i * 1.4}s;--rise:${-(sh.bottom - y - 14)}px"/>`).join('');
    return `<svg class="bt" viewBox="-6 -8 132 214" role="img" aria-label="Flacon ${String(p.name).replace(/"/g, '')}">
<defs>
<linearGradient id="${id}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${liquidA}"/><stop offset=".5" stop-color="${liquidB}"/><stop offset="1" stop-color="${liquidC}"/></linearGradient>
<linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".22" stop-color="#fff" stop-opacity=".08"/><stop offset=".78" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".38"/></linearGradient>
${capDefs(id, A.cap, P)}
<clipPath id="${id}k"><path d="${sh.body}"/></clipPath>
</defs>
<ellipse class="shadow" cx="60" cy="195" rx="38" ry="5" fill="rgba(20,16,40,.24)"/>
<rect x="${nx}" y="${ny}" width="${nw}" height="${nh}" fill="url(#${id}g)" stroke="rgba(255,255,255,.75)" stroke-width="1.3"/>

<rect class="shine" x="${sh.x[0] + 4}" y="${sh.top}" width="6" height="${sh.bottom - sh.top}" rx="3" fill="#fff" opacity=".42"/>

  }

  root.Art = { bottle, pal, famColor, hash, noGreen };
})(window);

<script>
// Ambiances animées : chaque parfum reçoit un mouvement tiré de ses notes (fumée pour le tabac,
// pétales pour la rose, braises pour les épices…). Un seul moteur canvas pilote toutes les zones.
(function (root) {
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const REDUCED = root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const KW = {
    petals: ['rose', 'jasmin', 'pivoine', 'tubereuse', 'magnolia', 'fleur', 'muguet', 'freesia', 'violette', 'ylang', 'neroli', 'orchidee', 'heliotrope', 'cyclamen', 'iris'],
    citrus: ['citron', 'bergamote', 'pamplemousse', 'mandarine', 'orange', 'petit grain', 'yuzu'],
    smoke: ['tabac', 'encens', 'oud', 'fumee', 'resine', 'cannabis', 'myrrhe', 'bouleau', 'gaiac', 'marron chaud'],
    embers: ['cannelle', 'cardamome', 'poivre', 'safran', 'clou de girofle', 'muscade', 'gingembre', 'cumin', 'coriandre', 'rhum'],
    bubbles: ['marin', 'sel', 'algue', 'lotus'],
    gold: ['ambre', 'vanille', 'benjoin', 'miel', 'tonka', 'caramel', 'praline', 'cacao', 'datte', 'cafe', 'opoponax'],
    leaves: ['vetiver', 'figuier', 'figue', 'the', 'sauge', 'pin', 'cedre', 'cypres', 'basilic', 'feuille', 'mousse', 'lavande', 'romarin', 'genievre', 'thym', 'ciste', 'santal'],
    musk: ['musc', 'ambrette', 'iso e super', 'linge propre', 'ambroxan'],
    stitch: ['cuir', 'daim'],
    drops: ['pomme', 'poire', 'framboise', 'fraise', 'litchi', 'mure', 'cassis', 'coing', 'ananas', 'noix de coco', 'rhubarbe'],
  };
  const FAM = { floral: 'petals', agrumes: 'citrus', oud: 'smoke', épicé: 'embers', aquatique: 'bubbles', ambré: 'gold', gourmand: 'gold', vert: 'leaves', aromatique: 'leaves', boisé: 'leaves', musqué: 'musk', cuir: 'stitch', fruité: 'drops' };
  const LABEL = { petals: 'pétales', citrus: 'agrumes', smoke: 'fumée', embers: 'braises', bubbles: 'bulles marines', gold: 'poussière dorée', leaves: 'feuilles', musk: 'peau tiède', stitch: 'coutures de cuir', drops: 'gouttes de fruit' };

  // Retourne les 2 ambiances dominantes et les notes qui les inspirent.
  function motifsOf(p) {
    const notes = (p.notes || []).map(norm), sc = {}, why = {};
    for (const [m, list] of Object.entries(KW)) {
      notes.forEach((n, i) => { if (list.some((k) => n === k || n.includes(k))) { sc[m] = (sc[m] || 0) + (2.2 - i * 0.25); (why[m] = why[m] || []).push(p.notes[i]); } });
    }
    const f = FAM[p.family]; if (f) sc[f] = (sc[f] || 0) + 2.4;
    const top = Object.entries(sc).sort((a, b) => b[1] - a[1]).map((e) => e[0]).slice(0, 2);
    if (!top.length) top.push('gold');
    return { types: top, label: top.map((m) => LABEL[m]).join(' et '), notes: [...new Set(top.flatMap((m) => why[m] || []))].slice(0, 3) };
  }

  // ---------- Particules ----------
  const T = {
    petals: { n: 14, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(-20, h) : -24; P.s = rnd(7, 15); P.vy = rnd(22, 44); P.vx = rnd(-8, 8); P.r = rnd(0, 6.3); P.vr = rnd(-1.3, 1.3); P.ph = rnd(0, 6.3); P.a = rnd(.55, .9); },
      up(P, d, t) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t * 1.3 + P.ph) * 20 * d; P.r += P.vr * d; }, out: (P, w, h) => P.y > h + 30,
      dr(c, P, k) { c.save(); c.translate(P.x, P.y); c.rotate(P.r); c.globalAlpha = P.a; c.fillStyle = k.f1; const s = P.s; c.beginPath(); c.moveTo(0, -s); c.bezierCurveTo(s * .9, -s * .6, s * .7, s * .7, 0, s); c.bezierCurveTo(-s * .7, s * .7, -s * .9, -s * .6, 0, -s); c.fill(); c.globalAlpha = P.a * .5; c.strokeStyle = k.f2; c.lineWidth = .8; c.beginPath(); c.moveTo(0, -s * .8); c.lineTo(0, s * .8); c.stroke(); c.restore(); } },
    leaves: { n: 14, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(-20, h) : -24; P.s = rnd(8, 16); P.vy = rnd(26, 50); P.vx = rnd(-14, 14); P.r = rnd(0, 6.3); P.vr = rnd(-1.8, 1.8); P.ph = rnd(0, 6.3); P.a = rnd(.5, .85); },
      up(P, d, t) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t * 1.6 + P.ph) * 26 * d; P.r += P.vr * d; }, out: (P, w, h) => P.y > h + 30,
      dr(c, P, k) { c.save(); c.translate(P.x, P.y); c.rotate(P.r); c.globalAlpha = P.a; c.fillStyle = k.f2; const s = P.s; c.beginPath(); c.moveTo(0, -s); c.quadraticCurveTo(s * .8, 0, 0, s); c.quadraticCurveTo(-s * .8, 0, 0, -s); c.fill(); c.strokeStyle = k.line; c.globalAlpha = P.a * .7; c.lineWidth = .9; c.beginPath(); c.moveTo(0, -s); c.lineTo(0, s * 1.15); c.stroke(); c.restore(); } },
    citrus: { n: 8, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(0, h) : h + 30; P.s = rnd(12, 24); P.vy = -rnd(14, 30); P.vx = rnd(-6, 6); P.r = rnd(0, 6.3); P.vr = rnd(-.5, .5); P.ph = rnd(0, 6.3); P.a = rnd(.6, .9); },
      up(P, d, t) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t + P.ph) * 10 * d; P.r += P.vr * d; }, out: (P) => P.y < -40,
      dr(c, P, k) { c.save(); c.translate(P.x, P.y); c.rotate(P.r); c.globalAlpha = P.a; c.fillStyle = k.f1; c.beginPath(); c.arc(0, 0, P.s, 0, 6.29); c.fill(); c.strokeStyle = k.f2; c.lineWidth = P.s * .16; c.stroke(); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; for (let i = 0; i < 8; i++) { const a = i * .785; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * P.s * .82, Math.sin(a) * P.s * .82); c.stroke(); } c.restore(); } },
    smoke: { n: 14, sp(P, w, h, i) { P.x = w * rnd(.2, .8); P.y = i ? rnd(0, h) : h + 40; P.s = rnd(30, 60); P.vy = -rnd(18, 36); P.vx = rnd(-8, 8); P.ph = rnd(0, 6.3); P.age = i ? rnd(0, 1) : 0; P.life = rnd(7, 12); },
      up(P, d, t, w, h) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t * .8 + P.ph) * 16 * d; P.age += d / P.life; }, out: (P) => P.age >= 1,
      dr(c, P, k) { const r = P.s * (1 + P.age * 1.6), a = Math.sin(Math.min(1, P.age) * Math.PI) * k.smokeA; const g = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, r); g.addColorStop(0, `rgba(${k.smoke},${a})`); g.addColorStop(1, `rgba(${k.smoke},0)`); c.fillStyle = g; c.beginPath(); c.arc(P.x, P.y, r, 0, 6.29); c.fill(); } },
    embers: { n: 34, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(0, h) : h + 10; P.s = rnd(1.2, 3.4); P.vy = -rnd(30, 80); P.vx = rnd(-14, 14); P.ph = rnd(0, 6.3); P.fl = rnd(4, 12); },
      up(P, d, t) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t * 2 + P.ph) * 14 * d; }, out: (P) => P.y < -10,
      dr(c, P, k, t) { const a = .45 + .55 * Math.abs(Math.sin(t * P.fl * .3 + P.ph)); const g = c.createRadialGradient(P.x, P.y, 0, P.x, P.y, P.s * 4); g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(.35, `rgba(${k.ember},${a * .8})`); g.addColorStop(1, `rgba(${k.ember},0)`); c.fillStyle = g; c.beginPath(); c.arc(P.x, P.y, P.s * 4, 0, 6.29); c.fill(); } },
    bubbles: { n: 22, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(0, h) : h + 20; P.s = rnd(3, 13); P.vy = -rnd(20, 56); P.ph = rnd(0, 6.3); },
      up(P, d, t) { P.y += P.vy * d; P.x += Math.sin(t * 2 + P.ph) * 12 * d; }, out: (P) => P.y < -20,
      dr(c, P, k) { c.strokeStyle = k.line; c.globalAlpha = .75; c.lineWidth = 1.2; c.fillStyle = k.f1; c.beginPath(); c.arc(P.x, P.y, P.s, 0, 6.29); c.globalAlpha = .12; c.fill(); c.globalAlpha = .7; c.stroke(); c.beginPath(); c.arc(P.x - P.s * .3, P.y - P.s * .3, P.s * .35, 3.4, 4.6); c.stroke(); c.globalAlpha = 1; } },
    gold: { n: 40, sp(P, w, h, i) { P.x = rnd(0, w); P.y = i ? rnd(0, h) : h + 8; P.s = rnd(1.5, 4.5); P.vy = -rnd(6, 18); P.vx = rnd(-4, 4); P.ph = rnd(0, 6.3); P.sp = rnd(1, 3); },
      up(P, d, t) { P.y += P.vy * d; P.x += P.vx * d + Math.sin(t + P.ph) * 6 * d; }, out: (P) => P.y < -10,
      dr(c, P, k, t) { const a = Math.abs(Math.sin(t * P.sp + P.ph)); c.save(); c.translate(P.x, P.y); c.globalAlpha = a * .95; c.fillStyle = k.gold; const s = P.s * 2.2; c.beginPath(); c.moveTo(0, -s); c.quadraticCurveTo(0, 0, s, 0); c.quadraticCurveTo(0, 0, 0, s); c.quadraticCurveTo(0, 0, -s, 0); c.quadraticCurveTo(0, 0, 0, -s); c.fill(); c.restore(); } },
    musk: { n: 6, sp(P, w, h, i) { P.x = w * rnd(.15, .85); P.y = h * rnd(.3, .9); P.age = i ? rnd(0, 1) : 0; P.life = rnd(4, 7); P.s = rnd(60, 140); },
      up(P, d) { P.age += d / P.life; }, out: (P) => P.age >= 1,
      dr(c, P, k) { const r = P.s * P.age; c.strokeStyle = k.f1; c.globalAlpha = (1 - P.age) * .5; c.lineWidth = 2 + (1 - P.age) * 8; c.beginPath(); c.arc(P.x, P.y, r, 0, 6.29); c.stroke(); c.globalAlpha = 1; } },
    stitch: { n: 9, sp(P, w, h, i) { P.y = (h / 10) * ((P.idx % 10) + .5) + rnd(-6, 6); P.x = 0; P.s = rnd(4, 9); P.sp = rnd(10, 28) * (P.idx % 2 ? 1 : -1); P.a = rnd(.25, .55); },
