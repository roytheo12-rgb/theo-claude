# Sillage : démo publique. Un seul Worker Cloudflare (offre gratuite) sert le site et l'API.
name = "sillage-demo"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Stockage des essais et des emails. Crée-le avec :  npx wrangler kv namespace create SILLAGE
# puis colle l'id affiché ci-dessous.
[[kv_namespaces]]
binding = "SILLAGE"
id = "COLLE_ICI_L_ID_DU_KV"

[vars]
MODEL = "claude-sonnet-5-5"   # pour plus de qualité (2× plus cher) : "claude-opus-5-5"
EFFORT = "low"
HAIKU_MODEL = "claude-haiku-5-5"  # identification des parfums (quasi gratuit)
IDENT_MAX = "15"            # analyses de parfum par visiteur (un parfum déjà connu ne compte pas)
IDENT_IP_MAX_PER_DAY = "40" # analyses par adresse IP et par jour
IDENT_DAILY_CAP = "600"     # analyses au total par jour
MAX_TRIES = "2"             # essais par visiteur
IP_MAX_PER_DAY = "6"        # essais par adresse IP et par jour (contourne les visiteurs qui changent de navigateur)
ADMIN_EMAILS = "roytheo12@gmail.com"  # ce compte devient « éditeur » (un courriel n'est pas un secret)
DAILY_CAP = "150"           # essais IA maximum par jour, tous visiteurs confondus : ton plafond de dépense
# Secrets à définir en ligne de commande (jamais dans ce fichier) :
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ADMIN_KEY
#   npx wrangler secret put SALT

# --- Whop, comptes, éditeur (voir docs/WHOP.md) ---
# WHOP_PRODUCTS fait le lien entre tes produits Whop et les offres de l'appli. Remplace par tes identifiants (commencent par prod_ ou plan_) :
# WHOP_PRODUCTS = '{"prod_PREMIUM":"premium","prod_FONDATEUR":"founder"}'
# Secrets à définir en ligne de commande :
#   npx wrangler secret put WHOP_API_KEY      (clé API Whop, droit member:basic:read)
#   npx wrangler secret put ADMIN_EMAILS      (ton email : ce compte devient « éditeur »)

# --- Sauvegarde quotidienne (facultatif mais conseillé) ---
# 1) npx wrangler r2 bucket create sillage-backups   2) décommente les lignes ci-dessous
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "sillage-backups"
# [triggers]
# crons = ["17 3 * * *"]
# Courriel (confirmation d'adresse, mot de passe oublié) : npx wrangler secret put RESEND_API_KEY ; MAIL_FROM = "Sillage <bonjour@ton-domaine.fr>"

# --- Réseau social (abonnements, avis, publications, marques, statistiques) : base D1 ---
# 1) npx wrangler d1 create sillage    2) colle l'identifiant ci-dessous et décommente
# [[d1_databases]]
# binding = "DB"
# database_name = "sillage"
# database_id = "COLLE_ICI_L_ID_DE_LA_BASE_D1"
# Les tables se créent toutes seules au premier appel. Offre marque : ajoute dans WHOP_PRODUCTS un produit "brand".
