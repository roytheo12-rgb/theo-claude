<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M01 · Intro de l'acte II · « Voici JobResolute. » · 5 s
     Le téléphone de Nadia flotte sur fond noir (reflet vert d'eau à gauche, ambre à droite : ses deux mondes),
     l'app JobResolute finit de charger (écran de lancement identique à references/raccords/iphone_lancement_JobResolute.png),
     le téléphone se tourne vers nous, on plonge dans l'écran : le blanc devient le noir du film, le logo grandit et prend ses couleurs. -->
<link rel="stylesheet" href="base.css">
<style>
html,body{background:#000}
.stage{perspective:1800px}
.dev{position:absolute;left:50%;top:50%;transform-style:preserve-3d;border-radius:54px;background:#0b0b0c;
  box-shadow:-18px 0 60px rgba(255,255,255,0.056),18px 0 60px rgba(255,255,255,0.052),0 70px 120px rgba(0,0,0,.9),0 0 0 2px #2a2b2c inset}
.screen{position:absolute;overflow:hidden;background:#fff}
.dark{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse 60% 55% at 50% 45%,#121212 0%,#050505 55%,#000 100%)}
.ui{position:absolute;left:50%;top:50%;width:393px;height:852px;margin:-426px 0 0 -196.5px;transform-origin:50% 50%}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:#000}
.time{font:600 17px "IT";letter-spacing:-.01em}
.icons{display:flex;gap:7px;align-items:center}
.tag{position:absolute;left:0;right:0;top:50%;margin-top:26px;text-align:center;font:500 16px "ID";letter-spacing:.01em;color:rgba(0,0,0,.6)}
.load{position:absolute;left:50%;top:50%;width:150px;height:5px;margin:96px 0 0 -75px;background:rgba(0,0,0,.1);border-radius:3px;overflow:hidden}
.load i{display:block;width:40%;height:100%;background:#34c26a;border-radius:3px}
.home{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:rgba(0,0,0,.85)}
.logo{position:absolute;left:0;right:0;top:50%;text-align:center;font-family:"ID";font-weight:600;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.floor{position:absolute;left:50%;top:50%;width:520px;height:90px;margin-left:-260px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,0.032),rgba(255,255,255,0.02) 45%,transparent 70%);filter:blur(10px)}
.ring{position:absolute;left:50%;top:50%;border:1.5px solid var(--laiton);border-radius:50%;opacity:0}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="floor" id="floor"></div>
  <div class="dev" id="dev"><div class="screen" id="screen">
    <div class="ui" id="ui">
      <div class="status">
        <div class="time">23:12</div>
        <div class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#000"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#000"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#000"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#000" opacity=".35"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0z" fill="#000"/><path d="M3.6 6.3a6.6 6.6 0 0 1 8.8 0l1.5-1.8a9 9 0 0 0-11.8 0z" fill="#000"/><path d="M.6 2.8a11 11 0 0 1 14.8 0" stroke="#000" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#000" stroke-opacity=".4" fill="none"/><rect x="2" y="2" width="7" height="9" rx="2" fill="#000"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#000" opacity=".4"/></svg>
        </div>
      </div>
      <div class="island"></div>
      <div class="tag">Chargement</div>
      <div class="load"><i id="bar"></i></div>
      <div class="home"></div>
    </div>
    <div class="dark" id="dark"></div>
    <div class="logo" id="logo"><span id="lj">Job</span><span id="lr">Resolute</span></div>
  </div></div>
  <div class="ring" id="r0"></div><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 5;
window.SFX = [[0.0, 'land', 0.25], [1.7, 'tick', 0.5], [1.6, 'riser', 0.45], [2.25, 'dive', 0.8], [3.15, 'shimmer', 0.7]];
const $ = id => document.getElementById(id);
const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;
const NOIR = [0, 0, 0], IVOIRE = [244, 239, 230], LAITON = [255, 255, 255];
// Image 0 calée sur la fin de P09 : écran de face, centré en largeur, centre à 46 % de la hauteur, 59 % de la hauteur de l'image
const W0 = 294, H0 = 637, Y0 = -43;    // écran du téléphone (proportions d'un iPhone : 393 × 852)
window.seek = t => {
  // 1. Départ de face, exactement comme dans les mains de Nadia (fondu enchaîné avec P09 dans CapCut),
  //    puis le téléphone se libère et flotte de trois quarts pendant que l'app finit de charger
  const out = easeOut(prog(t, 0.35, 1.1));
  const fl = Math.sin((t - 0.35) * 1.8) * 10 * out;
  $('bar').style.width = lerp(40, 100, easeOut(prog(t, 0.3, 1.8))) + '%';
  // 2. Il se retourne vers nous, puis on plonge dans l'écran (2,3 → 3,6 s)
  const turn = easeOut(prog(t, 1.7, 0.9));
  const g = easeOut(prog(t, 2.3, 1.3));
  const w = lerp(W0, 1960, g), h = lerp(H0, 1120, g), bz = lerp(13, 0, g);
  const d = $('dev');
  d.style.width = w + 2 * bz + 'px'; d.style.height = h + 2 * bz + 'px';
  d.style.marginLeft = -(w / 2 + bz) + 'px'; d.style.marginTop = -(h / 2 + bz) + 'px';
  d.style.borderRadius = lerp(52, 0, g) + 'px';
  const k = out * (1 - turn);
  const ry = -24 * k + Math.sin(t * 0.9) * 3 * k, rx = 7 * k, rz = -3 * k;
  d.style.transform = `translateY(${Y0 * (1 - g) + fl * (1 - turn)}px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg)`;
  const s = $('screen');
  s.style.left = s.style.top = bz + 'px'; s.style.width = w + 'px'; s.style.height = h + 'px';
  s.style.borderRadius = lerp(40, 0, g) + 'px';
  $('ui').style.transform = `scale(${w / 393})`;
  $('ui').style.opacity = 1 - easeOut(prog(t, 2.4, 0.35));
  $('floor').style.marginTop = H0 / 2 + Y0 + 40 + 'px';
  $('floor').style.opacity = out * (1 - g) * (0.8 + 0.2 * Math.sin(t * 1.8));
  // 3. Le blanc de l'app devient le noir du film ; le logo grandit et prend ses couleurs
  const c = easeOut(prog(t, 2.35, 0.45));
  $('dark').style.opacity = c;
  const fs = lerp(47 * W0 / 393, 112, g);
  const lg = $('logo'); lg.style.fontSize = fs + 'px'; lg.style.marginTop = -fs / 2 - lerp(4, 0, g) + 'px';
  $('lj').style.color = mix(NOIR, IVOIRE, c);
  $('lr').style.color = mix(NOIR, LAITON, c);
  // 4. Cercles concentriques en laiton
  ['r0', 'r1', 'r2'].forEach((id, i) => {
    const p = easeOut(prog(t, 3.2 + i * 0.18, 1.5));
    const dd = lerp(80, 520 + i * 240, p);
    const r = $(id); r.style.width = r.style.height = dd + 'px'; r.style.marginLeft = r.style.marginTop = -dd / 2 + 'px';
    r.style.opacity = p < 0.02 ? 0 : (0.55 - i * 0.12) * (1 - prog(t, 4.3 + i * 0.1, 0.7) * 0.7);
  });
  fx(t, 5, { push: 0.02 });
};
window.seek(0);
</script>
</body></html>
