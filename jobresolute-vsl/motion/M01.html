<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M01 · Entrée dans l'écran, le cadre passe de 1.37 à 16:9, logo · « Voici JobResolute. » · 4 s
     Image 0 = l'écran de lancement de l'iPhone de Nadia, identique à la fin de P09 (references/raccords/iphone_lancement_JobResolute.png) :
     fond blanc, barre d'état, logo noir, « Chargement », barre verte (exception de style validée par Théo, voir FACTS.md).
     Le chargement se termine, on entre dans l'écran : le blanc devient le noyer du film, le logo grandit et prend ses couleurs. -->
<link rel="stylesheet" href="base.css">
<style>
.screen{position:absolute;left:50%;top:50%;width:305px;height:662px;margin:-331px 0 0 -152.5px;border-radius:40px;overflow:hidden;
  background:radial-gradient(ellipse 60% 55% at 50% 50%,rgba(224,160,80,.30) 0%,rgba(224,160,80,.07) 45%,transparent 70%),linear-gradient(#1f150e,#120b07);
  box-shadow:0 0 120px rgba(224,160,80,.35),0 0 0 14px #0d0a08}
.white{position:absolute;inset:0;background:#fff}
/* L'interface de l'iPhone, dessinée en points iOS (393×852) puis mise à l'échelle de l'écran */
.ui{position:absolute;left:50%;top:50%;width:393px;height:852px;margin:-426px 0 0 -196.5px;transform-origin:50% 50%}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:#000}
.time{font:600 17px "IT";letter-spacing:-.01em}
.icons{display:flex;gap:7px;align-items:center}
.tag{position:absolute;left:0;right:0;top:50%;margin-top:26px;text-align:center;font:500 16px "ID";letter-spacing:.01em;color:rgba(0,0,0,.6)}
.load{position:absolute;left:50%;top:50%;width:150px;height:5px;margin:96px 0 0 -75px;background:rgba(0,0,0,.1);border-radius:3px;overflow:hidden}
.load i{display:block;width:62%;height:100%;background:#34c26a;border-radius:3px}
.home{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:rgba(0,0,0,.85)}
.ring{position:absolute;left:50%;top:50%;border:1.5px solid var(--laiton);border-radius:50%;opacity:0}
.logo{position:absolute;left:0;right:0;top:50%;margin-top:-62px;text-align:center;font:600 112px "ID";letter-spacing:-.04em;transform-origin:50% 50%;z-index:2}
</style></head>
<body>
<div class="bg" id="bg" style="opacity:0"></div>
<div class="stage" id="stage">
  <div class="screen" id="screen">
    <div class="white" id="white"></div>
    <div class="ui" id="ui">
      <div class="status">
        <div class="time">23:12</div>
        <div class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#000"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#000"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#000"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#000" opacity=".35"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0z" fill="#000"/><path d="M3.6 6.3a6.6 6.6 0 0 1 8.8 0l1.5-1.8a9 9 0 0 0-11.8 0z" fill="#000"/><path d="M.6 2.8a11 11 0 0 1 14.8 0" stroke="#000" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#000" stroke-opacity=".4" fill="none"/><rect x="2" y="2" width="7" height="9" rx="2" fill="#000"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#000" opacity=".4"/></svg>
        </div>
      </div>
      <div class="island"></div>
      <div class="tag" id="tag">Chargement</div>
      <div class="load"><i id="bar"></i></div>
      <div class="home"></div>
    </div>
  </div>
  <div class="ring" id="r0"></div><div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div class="logo" id="logo"><span id="lj">Job</span><span id="lr">Resolute</span></div>
</div>
<div class="mask" id="mL" style="left:0;top:0;bottom:0;width:220px"></div>
<div class="mask" id="mR" style="right:0;top:0;bottom:0;width:220px"></div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 4;
const $ = id => document.getElementById(id);
const mix = (a, b, p) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], p))).join(',')})`;
const NOIR = [0, 0, 0], IVOIRE = [244, 239, 230], LAITON = [212, 175, 116];
window.seek = t => {
  // 0. Le chargement se termine (62 % → 100 %)
  $('bar').style.width = lerp(62, 100, easeOut(prog(t, 0, 0.45))) + '%';
  // 1. L'écran du téléphone grandit jusqu'à remplir l'image (entrée dans l'écran)
  const g = easeOut(prog(t, 0.35, 1.3));
  const w = lerp(305, 1960, g), h = lerp(662, 1120, g);
  const s = $('screen');
  s.style.width = w + 'px'; s.style.height = h + 'px';
  s.style.marginLeft = -w / 2 + 'px'; s.style.marginTop = -h / 2 + 'px';
  s.style.borderRadius = lerp(40, 0, g) + 'px';
  $('bg').style.opacity = g > 0.98 ? 1 : 0;
  // L'interface de l'iPhone suit l'écran, puis s'efface
  $('ui').style.transform = `scale(${w / 393})`;
  $('ui').style.opacity = 1 - easeOut(prog(t, 0.45, 0.35));
  // 2. Le blanc de l'app devient le noyer du film ; le logo grandit et prend ses couleurs
  const c = easeOut(prog(t, 0.5, 0.7));
  $('white').style.opacity = 1 - c;
  // (au départ : même taille et même place que le logo de l'écran de lancement, 10 px plus haut que le centre)
  $('logo').style.transform = `translateY(${lerp(-10, 0, g)}px) scale(${lerp(0.326, 1, g)})`;
  $('lj').style.color = mix(NOIR, IVOIRE, c);
  $('lr').style.color = mix(NOIR, LAITON, c);
  // 3. Le cadre s'élargit : 1.37 → 16:9 (les bandes noires glissent hors champ)
  const m = easeOut(prog(t, 0.9, 0.9));
  $('mL').style.width = $('mR').style.width = lerp(220, 0, m) + 'px';
  // 4. Cercles concentriques en laiton
  ['r0', 'r1', 'r2'].forEach((id, i) => {
    const p = easeOut(prog(t, 1.4 + i * 0.18, 1.6));
    const d = lerp(80, 520 + i * 240, p);
    const r = $(id); r.style.width = r.style.height = d + 'px'; r.style.marginLeft = r.style.marginTop = -d / 2 + 'px';
    r.style.opacity = p < 0.02 ? 0 : (0.55 - i * 0.12) * (1 - prog(t, 2.8 + i * 0.1, 0.9) * 0.7);
  });
  fx(t, 4, { push: 0.02 });
};
window.seek(0);
</script>
</body></html>
