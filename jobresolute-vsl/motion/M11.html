<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M11 · Clôture · La ligne courbe dézoome : tout le parcours · « Pas un outil de plus. Tout le parcours. » · 4,8 s -->
<link rel="stylesheet" href="base.css">
<style>svg{position:absolute;left:0;top:0}</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage"><div id="world" style="position:absolute;inset:0;transform-origin:170px 520px"><svg width="1920" height="1080" viewBox="0 0 1920 1080" id="s"></svg></div></div>
<div class="cap" id="cap">Pas un outil de plus. *Tout* *le* *parcours.*</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 4.8;
const $ = id => document.getElementById(id);
// Les étapes du parcours, du clic de Nadia à la décision de Julien (libellés de FACTS.md)
const N = [
  ['Offre publiée', 0], ['Je suis intéressée', 0], ['Évaluation sur 5 dimensions', 0], ['Identité masquée', 0],
  ['Fit expliqué', 1], ['Carte de Cohésion', 1],
  ['Compte-rendu', 2], ['Fiche d\'entretien', 2], ['Décision humaine', 2],
  ['Suivi J+7 · J+30 · J+90', 3]];
const LAST = N.length - 1, DEC = 8;
const X = i => 170 + i * 176, Y = i => 520 + Math.sin(i * 0.9) * 90;
const path = 'M' + N.map((_, i) => `${X(i)} ${Y(i)}`).join(' L');
const groups = [['I · Observer', 0, 3], ['II · Associer', 4, 5], ['III · Décider', 6, 8], ['Et bien après', 9, 9]];
$('s').innerHTML =
  `<path id="p" d="${path}" fill="none" stroke="#b89560" stroke-width="3" stroke-linejoin="round"/>` +
  groups.map(([g, a, b], k) => `<g id="g${k}"><line x1="${X(a) - 30}" y1="300" x2="${X(b) + 30}" y2="300" stroke="#b89560" stroke-opacity=".5"/>
     <text x="${(X(a) + X(b)) / 2}" y="282" text-anchor="middle" font-family="IT" font-weight="600" font-size="18" letter-spacing="5" fill="#b89560">${g.toUpperCase()}</text></g>`).join('') +
  N.map(([l, g], i) => `<g id="n${i}"><circle cx="${X(i)}" cy="${Y(i)}" r="${i === DEC ? 26 : 18}" fill="${i === DEC ? '#5e1a24' : '#f4efe6'}" stroke="#d4af74" stroke-width="${i === DEC ? 3 : 0}"/>
     <text x="${X(i)}" y="${Y(i) + (i % 2 ? -44 : 58)}" text-anchor="middle" font-family="IT" font-weight="500" font-size="22" fill="#f4efe6">${l}</text>
     <text x="${X(i)}" y="${Y(i) + 6}" text-anchor="middle" font-family="ID" font-weight="600" font-size="15" fill="${i === DEC ? '#f4efe6' : '#5e1a24'}">${i + 1}</text></g>`).join('');
const P = $('p'), L = P.getTotalLength();
const cw = words($('cap'));
window.seek = t => {
  // Dézoom : on part du clic de Nadia et on découvre tout le parcours
  const z = easeOut(prog(t, 0, 2.4));
  $('world').style.transform = `scale(${lerp(2.4, 1, z)}) translate(${lerp(260, 0, z)}px, 0)`;
  P.setAttribute('stroke-dasharray', L); P.setAttribute('stroke-dashoffset', L * (1 - easeOut(prog(t, 0.1, 2.1))));
  N.forEach((_, i) => { const k = spring(prog(t, 0.1 + i * 0.2, 0.5)); const g = $('n' + i); g.setAttribute('opacity', clamp(k * 1.4)); });
  groups.forEach((_, k) => $('g' + k).setAttribute('opacity', easeOut(prog(t, 1.8 + k * 0.15, 0.5))));
  revealWords(cw, t, 2.3);
  fx(t, 4.8, { push: 0 });
};
window.seek(0);
</script>
</body></html>
