<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M10b · DÉCIDER · Hidden Gems (Bientôt) : un profil déjà évalué, non retenu, révélé pour un autre poste · « Les talents que le CV aurait écartés. » · 4,5 s
     Honnêteté : la démo présente Hidden Gems comme « Bientôt disponible, aperçu en simulation ». Le badge « Bientôt » reste visible. -->
<link rel="stylesheet" href="base.css">
<style>
svg{position:absolute;left:0;top:0}
.head{position:absolute;left:0;right:0;top:120px;text-align:center}
.head .h{color:var(--ivoire);font-size:44px;letter-spacing:-.02em}
.head .kt{color:rgba(244,239,230,.55);margin-top:10px}
#post{left:1240px;top:390px;width:470px;padding:26px 28px}
</style></head>
<body>
<div class="bg"></div>
<div class="chap"><b>III</b> · Décider</div>
<div class="stage" id="stage">
  <div class="head" id="head"><div class="h">Hidden Gems <span class="soon" style="vertical-align:10px;margin-left:12px">Bientôt</span></div>
    <div class="kt">Profils non détectés par les candidatures classiques</div></div>
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" id="s"></svg>
  <div class="card" id="post"><div class="k">Vivier de talents · Nouveau poste</div>
    <div class="h" style="margin-top:8px">Réceptionniste, CDI, réception principale</div>
    <div class="ln" style="width:80%;margin-top:16px"></div><div class="ln" style="width:62%"></div>
    <div style="margin-top:18px" class="ok" id="okp">✓ Profil déjà évalué · disponible</div></div>
</div>
<div class="cap" id="cap">Les talents que le CV aurait *écartés*.</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 4.5;
const $ = id => document.getElementById(id);
// Départ : le cercle de M10, exactement aux mêmes positions (raccord invisible)
const C = [960, 430], R = 300, n = 10;
const A = [...Array(n)].map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C[0] + R * Math.cos(a), C[1] + R * 0.78 * Math.sin(a)]; });
// Arrivée : le vivier, une grille sage à gauche
const G = A.map((_, i) => [330 + (i % 5) * 120, 400 + Math.floor(i / 5) * 140]);
const GEM = 6;
$('s').innerHTML = `<defs><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter></defs>` +
  A.map((p, i) => `<g id="a${i}"><circle r="38" fill="${i === GEM ? '#5e1a24' : '#e2d9cc'}" stroke="${i === GEM ? '#d4af74' : 'none'}" stroke-width="3"/>
   <g filter="url(#bl)"><circle cy="-8" r="12" fill="${i === GEM ? '#d4af74' : '#8c7a6a'}"/><path d="M-20 24 Q0 -2 20 24 Z" fill="${i === GEM ? '#d4af74' : '#8c7a6a'}"/></g></g>`).join('') +
  `<circle id="halo" r="70" fill="none" stroke="#d4af74" stroke-width="2" opacity="0"/>
   <path id="lk" d="" fill="none" stroke="#d4af74" stroke-width="2.5" stroke-dasharray="8 8" opacity="0"/>`;
const cw = words($('cap'));
window.seek = t => {
  // Le cercle se range en vivier
  const g = easeOut(prog(t, 0.2, 1.0));
  A.forEach((p, i) => {
    let x = lerp(p[0], G[i][0], g), y = lerp(p[1], G[i][1], g), sc = lerp(1, 0.85, g), op = 1;
    if (i !== GEM) op = 1 - easeOut(prog(t, 1.4, 0.6)) * 0.55;
    // Le profil révélé se détache et rejoint le nouveau poste
    if (i === GEM) { const m = spring(prog(t, 1.5, 1.0), 7); x = lerp(x, 1180, m); y = lerp(y, 505, m); sc = lerp(sc, 1.15, m); }
    const e = $('a' + i); e.setAttribute('transform', `translate(${x} ${y}) scale(${sc})`); e.setAttribute('opacity', op);
  });
  const gp = [lerp(A[GEM][0], G[GEM][0], g), lerp(A[GEM][1], G[GEM][1], g)];
  const h = $('halo'); const hp = easeOut(prog(t, 1.2, 0.5));
  const m = spring(prog(t, 1.5, 1.0), 7);
  h.setAttribute('cx', lerp(gp[0], 1180, m)); h.setAttribute('cy', lerp(gp[1], 505, m)); h.setAttribute('opacity', hp * (0.6 + 0.3 * Math.sin(t * 4)));
  fadeUp($('head'), t, 0.3, 0.6, 10);
  const pp = spring(prog(t, 1.9, 0.8)); const post = $('post');
  post.style.opacity = clamp(pp * 1.3); post.style.transform = `translateX(${(1 - pp) * 60}px) rotateY(-8deg)`;
  fadeUp($('okp'), t, 2.6, 0.4, 6);
  sheen(post, t, 2.1);
  revealWords(cw, t, 2.2);
  fx(t, 4.5, { push: 0.025 });
};
window.seek(0);
</script>
</body></html>
