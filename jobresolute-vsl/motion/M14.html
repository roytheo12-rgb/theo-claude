<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M14 · Acte IV · La vision : les 8 moteurs (tous « Bientôt »), le système nerveux RH de l'hospitalité · 8 s
     Pas de prix, pas de dates : c'est une vision, présentée honnêtement. -->
<link rel="stylesheet" href="base.css">
<style>
.top{position:absolute;left:0;right:0;top:110px;text-align:center}
.top .kt{color:var(--laiton);font-size:15px;letter-spacing:.4em}
.title{margin-top:18px;font:600 72px/1.05 "ID";letter-spacing:-.035em;color:var(--ivoire)}
.grid{position:absolute;z-index:2;left:210px;top:370px;width:1500px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.eng{height:130px;border-radius:20px;background:#231811;border:1px solid rgba(244,239,230,.14);padding:24px 26px;position:relative;overflow:hidden}
.eng .n{font:600 26px "ID";letter-spacing:-.015em;color:var(--ivoire)}
.eng .soon{position:absolute;left:26px;bottom:22px;font-size:11px;padding:5px 10px}
svg{position:absolute;left:0;top:0;pointer-events:none}
.adn{position:absolute;left:0;right:0;top:720px;text-align:center;font:500 30px/1.4 "ID";letter-spacing:-.01em;color:rgba(244,239,230,.82)}
.adn span{color:var(--laiton2)}
</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="top" id="top"><div class="kt">La vision</div><div class="title" id="ti">Le système nerveux RH de *l'hospitalité*.</div></div>
  <svg width="1920" height="1080" id="net"></svg>
  <div class="grid" id="grid"></div>
  <div class="adn" id="adn">De l'embauche sur preuves jusqu'au pilotage des équipes.<br><span>Sans jamais retirer la décision aux humains.</span></div>
</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 8;
const $ = id => document.getElementById(id);
const E = ['Work Intelligence', 'JobFit contextualisé', 'Team Intelligence', 'Hidden Gems', 'Potential Intelligence', 'Workforce Intelligence', 'Management Copilot', 'Integration Intelligence'];
$('grid').innerHTML = E.map((e, i) => `<div class="eng" id="e${i}"><div class="n">${e}</div><span class="soon">Bientôt</span></div>`).join('');
// Le réseau qui relie les moteurs (le « système nerveux »)
const cx = i => 210 + (i % 4) * 380.5 + 179, cy = i => 370 + Math.floor(i / 4) * 152 + 65;
const L = [[0, 1], [1, 2], [2, 3], [4, 5], [5, 6], [6, 7], [0, 4], [1, 5], [2, 6], [3, 7], [1, 6], [2, 5]];
$('net').innerHTML = L.map(([a, b], k) => `<line id="l${k}" x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}" stroke="#d4af74" stroke-width="1.5" opacity=".45"/>`).join('');
const tw = words($('ti'));
window.seek = t => {
  fadeUp($('top').querySelector('.kt'), t, 0.1, 0.5, 8);
  revealWords(tw, t, 0.3, 0.07, 0.5);
  E.forEach((_, i) => { const e = $('e' + i), p = spring(prog(t, 1.3 + i * 0.1, 0.7)); e.style.opacity = clamp(p * 1.3); e.style.transform = `translateY(${(1 - p) * 30}px) scale(${lerp(0.96, 1, p)})`; sheen(e, t, 1.6 + i * 0.1); });
  L.forEach((l, k) => { const e = $('l' + k); const len = Math.hypot(cx(l[0]) - cx(l[1]), cy(l[0]) - cy(l[1])); e.setAttribute('stroke-dasharray', len); e.setAttribute('stroke-dashoffset', len * (1 - easeOut(prog(t, 2.4 + k * 0.06, 0.7)))); });
  // Une impulsion lumineuse traverse le réseau
  const pulse = (t * 0.6) % 1;
  E.forEach((_, i) => { if (t > 3.2) $('e' + i).style.borderColor = `rgba(212,175,116,${0.18 + 0.4 * Math.max(0, 1 - Math.abs(pulse * 8 - i))})`; });
  fadeUp($('adn'), t, 3.6, 0.7, 12);
  fx(t, 8, { push: 0.025 });
};
window.seek(0);
</script>
</body></html>
