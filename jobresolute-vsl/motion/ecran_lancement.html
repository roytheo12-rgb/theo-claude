<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- Écran de lancement de l'app sur l'iPhone de Nadia (fin de P09, raccord avec M01).
     Rendu en 393×852 points × 3 = 1179×2556 px (taille d'une capture d'iPhone).
     Barre d'état, Dynamic Island, indicateur d'accueil, puis l'écran de lancement de JobResolute. -->
<style>
@font-face{font-family:"ID";src:url(../assets/fonts/InterDisplay-SemiBold.woff2);font-weight:600}
@font-face{font-family:"ID";src:url(../assets/fonts/InterDisplay-Medium.woff2);font-weight:500}
@font-face{font-family:"IT";src:url(../assets/fonts/Inter-SemiBold.woff2);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:393px;height:852px;overflow:hidden;background:#120b07}
body{position:relative;-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 75% 45% at 50% 47%,rgba(224,160,80,.34) 0%,rgba(224,160,80,.08) 50%,transparent 75%),linear-gradient(#1f150e,#120b07)}
.island{position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:#f4efe6}
.time{font:600 17px "IT";letter-spacing:-.01em}
.icons{display:flex;gap:7px;align-items:center}
.logo{position:absolute;left:0;right:0;top:50%;margin-top:-34px;text-align:center;font:600 47px "ID";letter-spacing:-.04em;color:#f4efe6}
.logo span{color:#d4af74}
.tag{position:absolute;left:0;right:0;top:50%;margin-top:26px;text-align:center;font:500 16px "ID";letter-spacing:.01em;color:rgba(244,239,230,.7)}
.load{position:absolute;left:50%;top:50%;width:84px;height:3px;margin:118px 0 0 -42px;background:rgba(184,149,96,.25);border-radius:3px;overflow:hidden}
.load i{display:block;width:62%;height:100%;background:#d4af74;border-radius:3px}
.home{position:absolute;bottom:8px;left:50%;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:rgba(244,239,230,.85)}
</style></head>
<body>
<div class="status">
  <div class="time">23:12</div>
  <div class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#f4efe6"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#f4efe6"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#f4efe6"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#f4efe6" opacity=".35"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5l2.4-2.9a3.6 3.6 0 0 0-4.8 0z" fill="#f4efe6"/><path d="M3.6 6.3a6.6 6.6 0 0 1 8.8 0l1.5-1.8a9 9 0 0 0-11.8 0z" fill="#f4efe6"/><path d="M.6 2.8a11 11 0 0 1 14.8 0" stroke="#f4efe6" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#f4efe6" stroke-opacity=".4" fill="none"/><rect x="2" y="2" width="7" height="9" rx="2" fill="#f4efe6"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#f4efe6" opacity=".4"/></svg>
  </div>
</div>
<div class="island"></div>
<div class="logo">Job<span>Resolute</span></div>
<div class="tag">Être, et faire.</div>
<div class="load"><i></i></div>
<div class="home"></div>
</body></html>
