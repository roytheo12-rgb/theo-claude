<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M02 · Les 4 promesses d'Henry en miroir typographique (le candidat à gauche, le recruteur à droite) · 6 s -->
<link rel="stylesheet" href="base.css">
<style>
.row{position:absolute;width:1400px}
.row.l{left:180px;text-align:left}
.row.r{right:180px;text-align:right}
.who{font:600 16px "IT";letter-spacing:.32em;text-transform:uppercase;color:var(--laiton);margin-bottom:12px}
.line{font:600 70px/1.05 "ID";letter-spacing:-.03em;color:var(--ivoire)}
</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="row l" style="top:150px"><div class="who" id="w0">Le candidat</div><div class="line" id="l0">Démontrer, *sans* *contrainte*.</div></div>
  <div class="row r" style="top:340px"><div class="who" id="w1">Le recruteur</div><div class="line" id="l1">Évaluer, *sans* *a* *priori*.</div></div>
  <div class="row l" style="top:530px"><div class="who" id="w2">Le candidat</div><div class="line" id="l2">Comprendre *son* *résultat*.</div></div>
  <div class="row r" style="top:720px"><div class="who" id="w3">Le recruteur</div><div class="line" id="l3">Décider, *en* *connaissance* *de* *cause*.</div></div>
</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 6;
const $ = id => document.getElementById(id);
const L = [0, 1, 2, 3].map(i => words($('l' + i)));
window.seek = t => {
  [0, 1, 2, 3].forEach(i => {
    const s = 0.25 + i * 1.3;
    fadeUp($('w' + i), t, s, 0.4, 8);
    revealWords(L[i], t, s + 0.1);
    // Les promesses déjà dites s'effacent légèrement pour guider l'œil
    const dim = prog(t, s + 1.3, 0.4) * 0.45 * (i < 3 ? 1 : 0);
    $('l' + i).style.opacity = 1 - dim; $('w' + i).style.opacity = Math.min(Number($('w' + i).style.opacity), 1 - dim);
  });
  fx(t, 6, { push: 0.025 });
};
window.seek(0);
</script>
</body></html>
