<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M12 · Sortie d'écran : on recule hors de l'ordinateur de Julien, le cadre passe en 2.39 → P10 · 2,5 s · coupe franche en sortie -->
<link rel="stylesheet" href="base.css">
<style>
#lap{left:560px;top:270px;width:800px;transform-origin:50% 40%}
#lap .scr{height:450px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.log{font:500 16px "IT";color:var(--taupe)}
.desk{position:absolute;left:0;right:0;top:800px;bottom:0;background:linear-gradient(#2a1a10,#130b06)}
.desk::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--laiton);opacity:.55}
.lamp{position:absolute;left:300px;top:560px;width:200px;height:240px}
.halo{position:absolute;left:150px;top:420px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,102,.45),transparent 65%)}
</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="desk" id="desk"></div><div class="halo" id="halo"></div><svg class="lamp" id="lamp" viewBox="0 0 200 240"><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#e9a95a"/><stop offset=".5" stop-color="#f6c47c"/><stop offset="1" stop-color="#d9964a"/></linearGradient></defs><path d="M30 110 L170 110 L145 20 L55 20 Z" fill="url(#sh)"/><g stroke="#c98a3a" stroke-width="1.5" opacity=".7"><line x1="68" y1="20" x2="52" y2="110"/><line x1="82" y1="20" x2="74" y2="110"/><line x1="100" y1="20" x2="100" y2="110"/><line x1="118" y1="20" x2="126" y2="110"/><line x1="132" y1="20" x2="148" y2="110"/></g><rect x="96" y="110" width="8" height="112" fill="#8a6a3c"/><ellipse cx="100" cy="226" rx="44" ry="9" fill="#8a6a3c"/></svg>
  <div class="laptop" id="lap"><div class="lid"><div class="scr">
    <div class="btn" id="btn" style="font-size:22px;padding:18px 30px"><span style="color:var(--laiton2)">◉</span> Décision humaine</div>
    <div class="log" id="log">Validé par Julien</div>
  </div></div><div class="base"></div></div>
</div>
<div class="mask" id="mT" style="left:0;right:0;top:0;height:0"></div>
<div class="mask" id="mB" style="left:0;right:0;bottom:0;height:0"></div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 2.5;
const $ = id => document.getElementById(id);
window.seek = t => {
  // On part de l'écran plein cadre, on recule jusqu'à voir l'ordinateur sur le bureau
  const z = easeOut(prog(t, 0.15, 1.5));
  $('lap').style.transform = `scale(${lerp(2.55, 1, z)})`;
  ['desk', 'lamp', 'halo'].forEach(id => $(id).style.opacity = easeOut(prog(t, 0.6, 0.8)));
  $('log').style.opacity = easeOut(prog(t, 0.0, 0.4));
  // Le cadre passe en cinémascope 2.39:1 (bandes de 138 px en haut et en bas)
  const m = easeOut(prog(t, 1.2, 0.9));
  $('mT').style.height = $('mB').style.height = lerp(0, 138, m) + 'px';
  fx(t, 2.5, { push: 0 });
};
window.seek(0);
</script>
</body></html>
