<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M12 · Entrée dans l'écran du recruteur, le cadre passe en 2.39 → P10 · 2,5 s · coupe franche en sortie
     Inversé (V4) : on avance vers l'écran jusqu'au plein cadre ; l'écran affiche le même contenu que le Mac de Julien au début de P10. -->
<link rel="stylesheet" href="base.css">
<style>
#lap{left:560px;top:270px;width:800px;transform-origin:50% 40%}
#lap .scr{height:450px;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff}
.msg{font:600 36px "ID";letter-spacing:-.03em;color:#2a9d57}
.logo2{font:600 23px "ID";letter-spacing:-.04em;color:#000}
.desk{position:absolute;left:0;right:0;top:800px;bottom:0;background:linear-gradient(#1c080c,#060203)}
.desk::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--laiton);opacity:.55}
.lamp{position:absolute;left:300px;top:560px;width:200px;height:240px}
.halo{position:absolute;left:150px;top:420px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(122,37,51,.45),transparent 65%)}
</style></head>
<body>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="desk" id="desk"></div><div class="halo" id="halo"></div><svg class="lamp" id="lamp" viewBox="0 0 200 240"><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#e8e1d6"/><stop offset=".5" stop-color="#f7f3ec"/><stop offset="1" stop-color="#d6cfc4"/></linearGradient></defs><path d="M30 110 L170 110 L145 20 L55 20 Z" fill="url(#sh)"/><g stroke="#bdb5a9" stroke-width="1.5" opacity=".7"><line x1="68" y1="20" x2="52" y2="110"/><line x1="82" y1="20" x2="74" y2="110"/><line x1="100" y1="20" x2="100" y2="110"/><line x1="118" y1="20" x2="126" y2="110"/><line x1="132" y1="20" x2="148" y2="110"/></g><rect x="96" y="110" width="8" height="112" fill="#6f6a64"/><ellipse cx="100" cy="226" rx="44" ry="9" fill="#6f6a64"/></svg>
  <div class="laptop" id="lap"><div class="lid"><div class="scr">
    <div class="msg" id="msg">✓ Décision validée</div>
    <div class="logo2" id="lg">JobResolute</div>
  </div></div><div class="base"></div></div>
</div>
<div class="mask" id="mT" style="left:0;right:0;top:0;height:0"></div>
<div class="mask" id="mB" style="left:0;right:0;bottom:0;height:0"></div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 2.5;
const $ = id => document.getElementById(id);
window.seek = t => {
  // On découvre l'ordinateur du recruteur sur son bureau, puis on avance jusqu'à ce que son écran remplisse l'image :
  // P10 commence sur ce même écran (le Mac de Julien, references/raccords/mac_decision_JobResolute.png) et recule.
  const z = (x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)(prog(t, 0.5, 1.8));
  $('lap').style.transform = `scale(${lerp(1, 2.62, z)})`;
  const room = 1 - easeOut(prog(t, 1.2, 0.8));
  ['desk', 'lamp', 'halo'].forEach(id => $(id).style.opacity = easeOut(prog(t, 0, 0.4)) * room);
  fadeUp($('msg'), t, 0.1, 0.4, 8); fadeUp($('lg'), t, 0.25, 0.4, 6);
  // Le cadre passe en cinémascope 2.39:1 (bandes de 138 px en haut et en bas)
  const m = easeOut(prog(t, 0.3, 1.2));
  $('mT').style.height = $('mB').style.height = lerp(0, 138, m) + 'px';
  // En plein cadre, l'écran doit être aussi net et blanc que celui du Mac de P10 : le vignettage s'efface
  document.querySelector('.vignette').style.opacity = 1 - z;
  fx(t, 2.5, { push: 0 });
};
window.seek(0);
</script>
</body></html>
