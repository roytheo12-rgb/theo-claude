<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<!-- M08 · DÉCIDER · Le même compte-rendu des deux côtés, au même instant des deux côtés · « Le même résultat, des deux côtés. » · 4 s -->
<link rel="stylesheet" href="base.css">
<style>
.desk{position:absolute;left:0;right:0;top:830px;bottom:0;background:linear-gradient(#2a1a10,#130b06)}
.desk::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--laiton);opacity:.55}
#ph{left:330px;top:150px;transform:scale(.97)}
#lap{left:820px;top:230px;width:840px}
#lap .scr{height:470px;padding:30px 36px}
.notif{position:absolute;left:14px;right:14px;top:50px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18);font:600 14.5px/1.35 "IT";color:var(--encre);z-index:4}
.notif small{display:block;font:600 11px "IT";letter-spacing:.14em;text-transform:uppercase;color:var(--bordeaux);margin-bottom:4px}
.badge{position:absolute;right:-16px;top:-16px;width:48px;height:48px;border-radius:50%;background:var(--bordeaux);border:2px solid var(--laiton2);color:var(--ivoire);font:600 22px/44px "ID";text-align:center;z-index:5}
.mini{display:flex;gap:30px;align-items:flex-start;margin-top:18px}
.n74{font:600 90px/.9 "ID";letter-spacing:-.05em}.n74 span{font-size:26px;color:#9a8b7f}
.mb{flex:1}.mb .t{height:8px;border-radius:9px;background:#e6ded1;margin-top:18px;overflow:hidden}.mb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--bordeaux2),var(--bordeaux))}
.lbl{position:absolute;top:880px;font:600 15px "IT";letter-spacing:.3em;text-transform:uppercase}
.sig{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.sig span{border-radius:99px;background:var(--bordeaux);color:var(--ivoire);font:600 14px "IT";text-align:center;padding:12px}
.sig .s2{background:transparent;color:var(--bordeaux);border:1.5px solid rgba(94,26,36,.5)}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(224,160,80,.55),transparent 65%)}
</style></head>
<body>
<div class="bg"></div>
<div class="chap"><b>III</b> · Décider</div>
<div class="stage" id="stage">
  <div class="desk"></div>
  <div class="glow" id="gl" style="left:200px;top:200px;width:600px;height:600px"></div>
  <div class="phone" id="ph"><div class="scr"><div class="notch"></div>
    <div class="notif" id="nt"><small>JobResolute</small>Votre compte-rendu est prêt</div>
    <div class="k" style="margin-top:96px">Compte-rendu · Chef de Rang</div>
    <div class="n74" style="margin-top:14px">74<span> /100</span></div>
    <div class="mb"><div class="t"><i style="width:82%"></i></div><div class="t"><i style="width:78%"></i></div><div class="t"><i style="width:85%"></i></div></div>
    <div class="sig" id="sig"><span>Valider</span><span class="s2">Signaler une inexactitude</span></div>
  </div></div>
  <div class="laptop" id="lap"><div class="lid"><div class="scr" id="ls">
    <div id="lc" style="opacity:0"><div class="k">Compte-rendu · Chef de Rang</div>
    <div class="mini"><div class="n74">74<span> /100</span></div>
    <div class="mb"><div class="t"><i style="width:82%"></i></div><div class="t"><i style="width:78%"></i></div><div class="t"><i style="width:85%"></i></div><div class="t"><i style="width:61%"></i></div><div class="t"><i style="width:70%"></i></div></div></div></div>
  </div></div><div class="base"></div></div>
  <div class="lbl" id="ln" style="left:330px;width:340px;text-align:center;color:var(--laiton2)">Le candidat</div>
  <div class="lbl" id="lj" style="left:820px;width:840px;text-align:center;color:var(--laiton2)">Le recruteur</div>
  <div class="glow" id="gl2" style="left:940px;top:170px;width:600px;height:600px"></div>
  <div id="sync" style="position:absolute;left:672px;top:452px;width:150px;height:2px;background:var(--laiton2);transform-origin:50% 50%"></div>
  <div id="dot" style="position:absolute;left:739px;top:445px;width:16px;height:16px;border-radius:50%;background:var(--laiton2);box-shadow:0 0 18px rgba(212,175,116,.9)"></div>
</div>
<div class="cap" id="cap">Le même résultat, *au* *même* *instant*.</div>
<div class="grain"></div><div class="vignette"></div>
<script src="lib.js"></script>
<script>
window.DURATION = 4;
const $ = id => document.getElementById(id);
const cw = words($('cap'));
window.seek = t => {
  // Même décor, deux appareils : le compte-rendu arrive des deux côtés AU MÊME INSTANT (T)
  const T = 0.9;
  fadeUp($('ph'), t, 0, 0.6, 30);
  fadeUp($('lap'), t, 0, 0.6, 30);
  // L'impulsion part du centre vers les deux appareils à la fois
  const k = easeOut(prog(t, T - 0.35, 0.35));
  $('sync').style.transform = `scaleX(${k})`; $('sync').style.opacity = k * (1 - prog(t, T + 0.3, 0.6));
  $('dot').style.opacity = clamp(prog(t, T - 0.45, 0.15)) * (1 - prog(t, T + 0.2, 0.5));
  $('dot').style.transform = `scale(${1 + 0.4 * Math.sin(t * 12)})`;
  const n = spring(prog(t, T, 0.6));
  $('nt').style.opacity = clamp(n * 1.4); $('nt').style.transform = `translateY(${(1 - n) * -40}px)`;
  const c = easeOut(prog(t, T, 0.5)); $('lc').style.opacity = c;
  document.querySelectorAll('#ph .scr > .k, #ph .scr > .n74, #ph .scr > .mb').forEach(el => el.style.opacity = c);
  document.querySelectorAll('#lc .t i, #ph .mb .t i').forEach((el, i) => { const w = el.dataset.w || (el.dataset.w = parseFloat(el.style.width)); el.style.width = w * easeOut(prog(t, T + 0.1 + (i % 5) * 0.1, 0.6)) + '%'; });
  const g = easeOut(prog(t, T, 0.6)) * (0.75 + 0.1 * Math.sin(t * 4));
  $('gl').style.opacity = g; $('gl2').style.opacity = g;
  fadeUp($('ln'), t, T + 0.2, 0.4, 6); fadeUp($('lj'), t, T + 0.2, 0.4, 6);
  fadeUp($('sig'), t, T + 0.5, 0.45, 8);
  sheen($('ls'), t, T + 0.1); sheen($('ph').querySelector('.scr'), t, T + 0.1);
  revealWords(cw, t, T + 0.3);
  fx(t, 4);
};
window.seek(0);
</script>
</body></html>
